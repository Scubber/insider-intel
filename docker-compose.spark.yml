# Spark tenant stack: run the full ingest + enrichment pipeline on a DGX Spark
# box that also hosts a vLLM OpenAI-compatible endpoint (the "sparky" host repo
# pattern: an external docker network named `sparky` with vLLM reachable at
# http://vllm:8000/v1). See docs/dgx-spark.md §4 and scripts/spark_refresh.sh.
#
#   docker compose -f docker-compose.spark.yml run --rm refresh
#
# No ports are published — this is a batch job, nothing is exposed. The corpus
# lives in ./data on the host, synced with the private GCS bucket by the
# wrapper script, and stays private end to end.
name: insider-intel-spark

services:
  refresh:
    build:
      context: .
      # runtime + OCR binaries (pdftoppm/tesseract) for the IndiaCourts
      # scanned-PDF path. A plain `docker build .` still yields the lean
      # runtime stage for Cloud Run (repo invariant — final alias stage).
      target: spark
    image: insider-intel-spark
    command: python -m apps.aggregator all
    env_file:
      - path: .env.spark
        required: true
    volumes:
      # Bucket-shaped data dir (raw/ processed/ state/ config/). The runtime
      # image's `app` user is uid 1000 — keep ./data owned by the uid-1000
      # host user or the job can't write.
      - ./data:/app/data
    networks:
      - sparky
    init: true

  # Full-history bulk sweep (tar streaming; see indiacourts_bulk.py). Started
  # explicitly (`--profile sweep up -d sweep`), capped so the chat stack and
  # nightly cycle never feel it, and it pauses itself while the refresh flock
  # is held. Zero GPU use by design.
  sweep:
    profiles: ["sweep"]
    build:
      context: .
      target: spark
    image: insider-intel-spark
    command: python -m apps.aggregator sweep_indiacourts_bulk -v
    env_file:
      - path: .env.spark
        required: true
    environment:
      SPARK_REFRESH_LOCK_PATH: /host-tmp/insider-intel-spark-refresh.lock
    volumes:
      - ./data:/app/data
      - /tmp:/host-tmp:ro
    cpus: 6
    mem_limit: 6g
    networks:
      - sparky
    init: true
    restart: "no"

networks:
  sparky:
    external: true
    name: sparky
