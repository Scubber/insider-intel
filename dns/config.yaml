# octoDNS config — DNS as code for this project's zones on Cloudflare.
#
# Zones live as YAML files in this directory; changes ship like everything
# else here: PR → dns-plan shows the diff → merge → dns-apply pushes it.
# The CLOUDFLARE_API_TOKEN repo secret (Zone:Read + DNS:Edit, all zones)
# is the only credential; nothing sensitive lives in these files.
#
# ACTIVATION: a zone listed here must already exist in the Cloudflare
# account (registered there, or added and delegated). Uncomment its entry
# once it does — until then octodns-sync would fail on the missing zone.

providers:
  zones_config:
    class: octodns.provider.yaml.YamlProvider
    directory: ./dns
    default_ttl: 300
    enforce_order: true

  cloudflare:
    class: octodns_cloudflare.CloudflareProvider
    token: env/CLOUDFLARE_API_TOKEN
    # Account-owned tokens are rejected by the Page Rules endpoint, which the
    # provider otherwise queries for URLFWD support. We use no URLFWD records.
    pagerules: false

processors:
  # insider-intel.net apex + www are Workers Custom Domains: the park-redirect
  # Worker creates and owns their DNS records (proxied AAAA 100::). They are
  # deliberately absent from insider-intel.net.yaml, so without this filter
  # octoDNS plans their deletion — which would take down the production site.
  # include_target defaults to true, hiding the live records from the diff.
  worker-owned:
    class: octodns.processor.filter.NameRejectlistFilter
    rejectlist:
      - ''
      - www

zones:
  insider-intel.net.:
    sources: [zones_config]
    targets: [cloudflare]
    processors: [worker-owned]
  thederpweb.com.:
    sources: [zones_config]
    targets: [cloudflare]
