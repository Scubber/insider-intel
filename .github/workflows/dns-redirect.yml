name: dns-redirect

# Upsert the insider-intel.net parking redirect (301 → intel.thederpweb.com)
# as a Page Rule (Forwarding URL) via the Cloudflare API — the mechanism the
# operator's token can write (Page Rules Write; it lacks Single Redirect) —
# then verify the domain actually answers with it. Dispatch-only; idempotent
# (matches on the URL pattern and updates in place). Cutover retires it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_ADMIN || secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: insider-intel.net
      TARGET: https://intel.thederpweb.com
    steps:
      - name: Which credential is in play
        env:
          DNS_ADMIN_SET: ${{ secrets.CLOUDFLARE_DNS_ADMIN != '' }}
        run: |
          set -euo pipefail
          echo "CLOUDFLARE_DNS_ADMIN secret present: ${DNS_ADMIN_SET}"
          curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | jq '{success, status: .result.status, token_id: .result.id, errors}'
      - name: Dump the active token's own permission policy
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          ACC=$(curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id // empty')
          echo "account: ${ACC:-<not readable>}"
          if [ -n "${ACC}" ]; then
            curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACC}/tokens?per_page=50" \
              | jq '[.result // [] | .[] | {name, status, groups: [.policies[]?.permission_groups[]?.name]}]' \
              || echo "token list not readable with this token"
          fi
          echo "--- read test: dynamic-redirect entrypoint ---"
          Z=$(curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" | jq -r '.result[0].id')
          curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones/${Z}/rulesets/phases/http_request_dynamic_redirect/entrypoint" \
            | jq '{success, errors, rules: (.result.rules // [] | length)}'
      - name: Resolve zone id
        id: zone
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -sf -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
            | jq -re '.result[0].id')
          echo "id=${ZONE_ID}" >> "$GITHUB_OUTPUT"
          echo "zone ${ZONE_NAME} = ${ZONE_ID}"
      - name: Install redirect (ruleset, then Worker, then page-rule)
        run: |
          set -euo pipefail
          Z="${{ steps.zone.outputs.id }}"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          JSON=(-H "Content-Type: application/json")

          # --- Attempt 1: modern dynamic-redirect ruleset (needs Single Redirect perm) ---
          RS_BODY=$(jq -n --arg target "${TARGET}" '{
            name: "default", kind: "zone", phase: "http_request_dynamic_redirect",
            rules: [{description: "park-redirect", expression: "true", action: "redirect",
              action_parameters: {from_value: {status_code: 301,
                target_url: {expression: ("concat(\"" + $target + "\", http.request.uri.path)")},
                preserve_query_string: true}}}]
          }')
          RESP=$(curl -s -X PUT "${AUTH[@]}" "${JSON[@]}" --data "${RS_BODY}" \
            "https://api.cloudflare.com/client/v4/zones/${Z}/rulesets/phases/http_request_dynamic_redirect/entrypoint")
          echo "1) ruleset:"; echo "${RESP}" | jq -c '{success, errors}'
          if echo "${RESP}" | jq -e '.success' >/dev/null; then echo "installed via ruleset"; exit 0; fi

          # --- Attempt 2: Worker (token has Workers Scripts Write) + zone route ---
          ACC=$(curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          cat > /tmp/worker.js <<'WEOF'
          export default {
            async fetch(request) {
              const url = new URL(request.url);
              return Response.redirect("https://intel.thederpweb.com" + url.pathname + url.search, 301);
            }
          };
          WEOF
          sed -i 's/^          //' /tmp/worker.js
          RESP=$(curl -s -X PUT "${AUTH[@]}" \
            -F 'metadata={"main_module":"worker.js","compatibility_date":"2026-01-01"};type=application/json' \
            -F 'worker.js=@/tmp/worker.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${ACC}/workers/scripts/park-redirect")
          echo "2a) worker upload:"; echo "${RESP}" | jq -c '{success, errors}'
          if echo "${RESP}" | jq -e '.success' >/dev/null; then
            EXISTING=$(curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones/${Z}/workers/routes" \
              | jq -r '.result // [] | map(select(.script == "park-redirect")) | .[0].id // empty')
            ROUTE_BODY='{"pattern":"*'"${ZONE_NAME}"'/*","script":"park-redirect"}'
            if [ -n "${EXISTING}" ]; then
              RESP=$(curl -s -X PUT "${AUTH[@]}" "${JSON[@]}" --data "${ROUTE_BODY}" \
                "https://api.cloudflare.com/client/v4/zones/${Z}/workers/routes/${EXISTING}")
            else
              RESP=$(curl -s -X POST "${AUTH[@]}" "${JSON[@]}" --data "${ROUTE_BODY}" \
                "https://api.cloudflare.com/client/v4/zones/${Z}/workers/routes")
            fi
            echo "2b) worker route:"; echo "${RESP}" | jq -c '{success, errors}'
            if echo "${RESP}" | jq -e '.success' >/dev/null; then echo "installed via Worker route"; exit 0; fi
          fi

          # --- Attempt 3: legacy page rule (user tokens only) ---
          PATTERN="*${ZONE_NAME}/*"
          PR_BODY=$(jq -n --arg pat "${PATTERN}" --arg target "${TARGET}/\$2" '{
            targets: [{target: "url", constraint: {operator: "matches", value: $pat}}],
            actions: [{id: "forwarding_url", value: {url: $target, status_code: 301}}],
            status: "active"}')
          RESP=$(curl -s -X POST "${AUTH[@]}" "${JSON[@]}" --data "${PR_BODY}" \
            "https://api.cloudflare.com/client/v4/zones/${Z}/pagerules")
          echo "3) page rule:"; echo "${RESP}" | jq -c '{success, errors}'
          echo "${RESP}" | jq -e '.success' >/dev/null || {
            echo "::error::All three mechanisms failed — see per-attempt errors above."
            exit 1
          }
          echo "installed via page rule"
      - name: Verify the domain answers with the redirect
        run: |
          set -euo pipefail
          for host in "${ZONE_NAME}" "www.${ZONE_NAME}"; do
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${host}/" || echo 000)
              LOC=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "https://${host}/" || true)
              echo "attempt ${i}: https://${host}/ → ${CODE} ${LOC}"
              if [ "${CODE}" = "301" ] && [ "${LOC}" = "${TARGET}/" ]; then
                break
              fi
              [ "${i}" = "5" ] && { echo "::error::https://${host}/ did not return the expected 301 → ${TARGET}/"; exit 1; }
              sleep 5
            done
          done
          echo "Redirect live on apex + www."
