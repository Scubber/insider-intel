name: dns-redirect

# Upsert the insider-intel.net parking redirect (301 → intel.thederpweb.com)
# as a Page Rule (Forwarding URL) via the Cloudflare API — the mechanism the
# operator's token can write (Page Rules Write; it lacks Single Redirect) —
# then verify the domain actually answers with it. Dispatch-only; idempotent
# (matches on the URL pattern and updates in place). Cutover retires it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_ADMIN || secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: insider-intel.net
      TARGET: https://intel.thederpweb.com
    steps:
      - name: Which credential is in play
        env:
          DNS_ADMIN_SET: ${{ secrets.CLOUDFLARE_DNS_ADMIN != '' }}
        run: |
          set -euo pipefail
          echo "CLOUDFLARE_DNS_ADMIN secret present: ${DNS_ADMIN_SET}"
          curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | jq '{success, status: .result.status, token_id: .result.id, errors}'
      - name: Resolve zone id
        id: zone
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -sf -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
            | jq -re '.result[0].id')
          echo "id=${ZONE_ID}" >> "$GITHUB_OUTPUT"
          echo "zone ${ZONE_NAME} = ${ZONE_ID}"
      - name: Upsert forwarding page rule
        run: |
          set -euo pipefail
          Z="${{ steps.zone.outputs.id }}"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          PATTERN="*${ZONE_NAME}/*"
          BODY=$(jq -n --arg pat "${PATTERN}" --arg target "${TARGET}/\$2" '{
            targets: [{target: "url", constraint: {operator: "matches", value: $pat}}],
            actions: [{id: "forwarding_url", value: {url: $target, status_code: 301}}],
            status: "active"
          }')
          EXISTING=$(curl -s "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones/${Z}/pagerules" \
            | jq -r --arg pat "${PATTERN}" '.result // [] | map(select(.targets[0].constraint.value == $pat)) | .[0].id // empty')
          if [ -n "${EXISTING}" ]; then
            RESP=$(curl -s -X PUT "${AUTH[@]}" --data "${BODY}" \
              "https://api.cloudflare.com/client/v4/zones/${Z}/pagerules/${EXISTING}")
          else
            RESP=$(curl -s -X POST "${AUTH[@]}" --data "${BODY}" \
              "https://api.cloudflare.com/client/v4/zones/${Z}/pagerules")
          fi
          echo "${RESP}" | jq '{success, errors, rule: {id: .result.id, status: .result.status, target: .result.targets[0].constraint.value, action: .result.actions[0].value}}'
          echo "${RESP}" | jq -e '.success' >/dev/null || {
            echo "::error::Page rule write failed — see errors above."
            exit 1
          }
      - name: Verify the domain answers with the redirect
        run: |
          set -euo pipefail
          for host in "${ZONE_NAME}" "www.${ZONE_NAME}"; do
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${host}/" || echo 000)
              LOC=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "https://${host}/" || true)
              echo "attempt ${i}: https://${host}/ → ${CODE} ${LOC}"
              if [ "${CODE}" = "301" ] && [ "${LOC}" = "${TARGET}/" ]; then
                break
              fi
              [ "${i}" = "5" ] && { echo "::error::https://${host}/ did not return the expected 301 → ${TARGET}/"; exit 1; }
              sleep 5
            done
          done
          echo "Redirect live on apex + www."
