name: ci

# CI runs the SAME Makefile targets as local dev, inside the same dev image,
# against the same compose Postgres sidecar — green locally means green here.
on:
  push:
    paths:
      - "apps/**"
      - "shared/**"
      - "tests/**"
      - "web/**"
      - "scripts/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "shared/**"
      - "tests/**"
      - "web/**"
      - "scripts/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build dev image
        run: make build
      - name: Lint
        run: make lint
      - name: Test (against Postgres sidecar)
        run: make test

  # Shell gate: scripts/*.sh are unattended production plumbing (the nightly
  # refresh cycle among them) and `bash -n` only catches syntax. shellcheck
  # catches the semantics — word-splitting, quoting, trap and directive
  # errors — which is how a malformed disable directive that silently broke a
  # whole function was found on 2026-08-20.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable scripts/*.sh

  # Browser-floor gate (operator directive 2026-08-17, after a broken deploy
  # shipped): the real web/ served statically, driven headless in Chromium at
  # 390 and 1280. No API, no snapshot — the floor is zero script errors and
  # every surface rendering. Extend branch protection to require this job
  # alongside build-test (repo-admin step; see docs).
  ui-smoke:
    runs-on: ubuntu-latest
    # A hung Playwright/Chromium download once blocked a PR for hours (the
    # runner default is 360 min); the whole job normally finishes in ~5.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Browser smoke (static web/, 390 + 1280)
        run: python scripts/ui_smoke_ci.py
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-smoke-failures
          path: ui-smoke-artifacts/
          if-no-files-found: ignore
