name: service-logs

# Read-only: dump recent Cloud Run API-service error/warning logs for
# incident diagnosis. No mutation, no LLM spend.
on:
  workflow_dispatch:
    inputs:
      freshness:
        description: "How far back to read (gcloud freshness, e.g. 2h)"
        required: false
        default: "2h"
      match:
        description: "Optional grep -E filter applied to the log lines"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: insider-intel-502413

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/698664056335/locations/global/workloadIdentityPools/github/providers/github-oidc # pragma: allowlist secret
          service_account: github-deployer@insider-intel-502413.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Dump API service errors
        run: |
          set -euo pipefail
          FILTER='resource.type=cloud_run_revision AND resource.labels.service_name=insider-intel-api AND severity>=WARNING'
          gcloud logging read "$FILTER" \
            --project "${PROJECT_ID}" \
            --freshness "${{ inputs.freshness }}" \
            --order desc \
            --limit 200 \
            --format 'value(timestamp, severity, textPayload)' \
            | { if [ -n "${{ inputs.match }}" ]; then grep -E "${{ inputs.match }}" || true; else cat; fi; } \
            | head -300
      - name: Dump request 5xx lines
        run: |
          set -euo pipefail
          FILTER='resource.type=cloud_run_revision AND resource.labels.service_name=insider-intel-api AND httpRequest.status>=500'
          gcloud logging read "$FILTER" \
            --project "${PROJECT_ID}" \
            --freshness "${{ inputs.freshness }}" \
            --order desc \
            --limit 50 \
            --format 'value(timestamp, httpRequest.status, httpRequest.requestUrl, httpRequest.latency)'
