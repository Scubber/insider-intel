name: sparky-ops

# Operate the DGX Spark refresh tenant through the self-hosted runner ON the
# box (registered 2026-08-23) — merge-audited, dispatch-gated ops instead of
# operator-terminal relay. The runner user's permissions bound everything.
#
# Rules baked in:
#   - workflow_dispatch ONLY: nothing on this runner fires from pushes or PRs.
#   - No third-party actions (nothing to SHA-pin); no repo checkout — every op
#     targets the box's OPERATIONAL clone (default ~/insider-intel), the one
#     the 08:00Z cron builds, never the runner's workdir.
#   - Secrets never print: .env.spark is only ever shown as key NAMES.
#   - Mutating ops (pull-main, enable-india, smoke-india, run-refresh) require
#     confirm=RUN. run-refresh respects the wrapper's own flock — a cycle in
#     progress makes it skip loudly, so it cannot double-write the bucket.
on:
  workflow_dispatch:
    inputs:
      op:
        description: >-
          diagnose (identity/cron/log/checkout forensics) | tail-refresh-log |
          env-audit (key NAMES only) | git-status | pull-main | enable-india |
          smoke-india | run-replay | run-refresh
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - hunt-writer
          - tail-refresh-log
          - env-audit
          - git-status
          - pull-main
          - enable-india
          - enable-ocr
          - smoke-india
          - extract-india
          - run-replay
          - run-refresh
          - sweep-start
          - sweep-status
          - sweep-stop
          - gcp-sweep-launch
          - gcp-sweep-status
          - gcp-sweep-delete
          - sweep-audit
      confirm:
        description: "mutating ops only: must be the literal word RUN"
        required: false
        default: ""
      lines:
        description: "tail-refresh-log: line count"
        required: false
        default: "150"
      reserve:
        description: "enable-india: also set SUMMARIZER_BACKFILL_RESERVE to this (empty = leave as-is)"
        required: false
        default: ""
      retry_days:
        description: "extract-india: override INDIACOURTS_RETRY_DAYS for this run (0 = retry parked PDFs now; empty = configured cool-down)"
        required: false
        default: ""

concurrency:
  group: sparky-ops
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  op:
    runs-on: self-hosted
    timeout-minutes: 510 # a full spark_refresh is bounded at 8h by its own timeout
    env:
      WORKDIR: ${{ vars.SPARKY_WORKDIR || '' }}
      OP: ${{ github.event.inputs.op }}
      CONFIRM: ${{ github.event.inputs.confirm }}
      LINES: ${{ github.event.inputs.lines }}
      RESERVE: ${{ github.event.inputs.reserve }}
      RETRY_DAYS: ${{ github.event.inputs.retry_days }}
    steps:
      - name: Resolve operational checkout
        run: |
          set -euo pipefail
          WORKDIR="${WORKDIR:-$HOME/insider-intel}"
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          [ -d "$WORKDIR/.git" ] || { echo "No git checkout at $WORKDIR"; exit 1; }
          case "$OP" in
            pull-main|enable-india|enable-ocr|smoke-india|extract-india|run-refresh|sweep-start|sweep-stop|gcp-sweep-launch|gcp-sweep-delete)
              [ "$CONFIRM" = "RUN" ] || { echo "op '$OP' mutates the box — re-dispatch with confirm=RUN"; exit 1; } ;;
          esac

      - name: diagnose
        if: ${{ github.event.inputs.op == 'diagnose' }}
        run: |
          set -uo pipefail
          echo "== identity =="; whoami; id; hostname; echo "HOME=$HOME"
          echo; echo "== operational checkout ($WORKDIR) =="
          git -C "$WORKDIR" log --oneline -1; git -C "$WORKDIR" branch --show-current
          git -C "$WORKDIR" status --short | head -20
          echo; echo "== cron (expect exactly one 0 8 * * * entry) =="
          crontab -l 2>/dev/null || echo "(no crontab for $(whoami))"
          echo; echo "== systemd timers (top 15) =="
          systemctl list-timers --all 2>/dev/null | head -15 || true
          echo; echo "== other compose checkouts under \$HOME (stale-data suspects) =="
          find "$HOME" -maxdepth 3 -name docker-compose.spark.yml -not -path "*/actions-runner/*" 2>/dev/null || true
          echo; echo "== data dir vintage in each =="
          for f in $(find "$HOME" -maxdepth 3 -name docker-compose.spark.yml -not -path "*/actions-runner/*" 2>/dev/null); do
            d="$(dirname "$f")/data/processed/articles.jsonl"
            [ -f "$d" ] && stat -c '%y  %s bytes  %n' "$d" || echo "(no processed corpus in $(dirname "$f"))"
          done
          echo; echo "== docker =="
          docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}' 2>/dev/null || echo "(no docker access for runner user)"
          echo; echo "== refresh lock =="
          ls -la /tmp/insider-intel-spark-refresh.lock 2>/dev/null || echo "(no lock held)"
          echo; echo "== spark_refresh.log tail (last 120) =="
          tail -n 120 "$WORKDIR/logs/spark_refresh.log" 2>/dev/null || echo "(no log at $WORKDIR/logs/spark_refresh.log)"
          echo; echo "== log lines around the 00:04Z window (08-22/08-23) =="
          grep -n "2026-08-2[23]" "$WORKDIR/logs/spark_refresh.log" 2>/dev/null | tail -40 || true

      - name: hunt-writer
        if: ${{ github.event.inputs.op == 'hunt-writer' }}
        run: |
          set -uo pipefail
          echo "== is the refresh flock actually HELD right now? =="
          if flock -n /tmp/insider-intel-spark-refresh.lock true 2>/dev/null; then
            echo "lock is FREE (file exists but nothing holds it)"
          else
            echo "lock is HELD; holder:"
            fuser -v /tmp/insider-intel-spark-refresh.lock 2>&1 || true
          fi
          echo; echo "== live pipeline-ish processes (start time, cmd) =="
          ps -eo pid,lstart,etime,user,args --sort=start_time \
            | grep -Ei "spark_refresh|aggregator|run_all|model-enrich|replay|gsutil|gcloud storage" \
            | grep -v grep || echo "(none running)"
          echo; echo "== ALL containers incl. exited (created/exited times are the writer timeline) =="
          docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Command}}' | head -25
          echo; echo "== docker events yesterday 18:00Z -> now (container starts/stops) =="
          docker events --since '2026-08-22T18:00:00Z' --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --filter type=container --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}}' 2>/dev/null \
            | grep -E ' (start|die) ' | head -60 || echo "(docker events unavailable)"
          echo; echo "== other home dirs (second-checkout suspects) =="
          ls -la /home/ 2>/dev/null
          for h in /home/*/; do
            [ "$h" = "$HOME/" ] && continue
            find "$h" -maxdepth 2 -name docker-compose.spark.yml 2>/dev/null || true
            [ -f "$h/insider-intel/data/processed/articles.jsonl" ] && \
              stat -c '%y  %s bytes  %n' "$h/insider-intel/data/processed/articles.jsonl" 2>/dev/null || true
          done
          echo; echo "== other crontabs (needs passwordless sudo; skipped otherwise) =="
          for u in $(cut -d: -f1 /etc/passwd); do
            sudo -n crontab -l -u "$u" 2>/dev/null | grep -v '^#' | grep . | sed "s/^/[$u] /" || true
          done
          echo; echo "== recent shell history mentioning refresh/sweep/enrich (own user only) =="
          grep -hE "spark_refresh|reenrich|sweep|model-enrich|run_all" "$HOME/.bash_history" 2>/dev/null | tail -25 || true

      - name: tail-refresh-log
        if: ${{ github.event.inputs.op == 'tail-refresh-log' }}
        run: |
          set -euo pipefail
          tail -n "${LINES:-150}" "$WORKDIR/logs/spark_refresh.log"

      - name: env-audit
        if: ${{ github.event.inputs.op == 'env-audit' }}
        run: |
          set -euo pipefail
          echo "== .env.spark key NAMES (values never printed) =="
          grep -Ev '^\s*(#|$)' "$WORKDIR/.env.spark" | cut -d= -f1 | sort

      - name: git-status
        if: ${{ github.event.inputs.op == 'git-status' }}
        run: |
          set -euo pipefail
          git -C "$WORKDIR" fetch origin main -q || true
          git -C "$WORKDIR" log --oneline -1
          git -C "$WORKDIR" branch --show-current
          git -C "$WORKDIR" status --short | head -30
          echo "behind origin/main by: $(git -C "$WORKDIR" rev-list --count HEAD..origin/main 2>/dev/null || echo '?') commit(s)"

      - name: pull-main
        if: ${{ github.event.inputs.op == 'pull-main' }}
        run: |
          set -euo pipefail
          git -C "$WORKDIR" checkout main
          git -C "$WORKDIR" pull origin main
          git -C "$WORKDIR" log --oneline -1

      - name: enable-india
        if: ${{ github.event.inputs.op == 'enable-india' }}
        run: |
          set -euo pipefail
          ENV_FILE="$WORKDIR/.env.spark"
          [ -f "$ENV_FILE" ] || { echo "no $ENV_FILE"; exit 1; }
          if grep -q '^INDIACOURTS_ENABLED=' "$ENV_FILE"; then
            sed -i 's/^INDIACOURTS_ENABLED=.*/INDIACOURTS_ENABLED=true/' "$ENV_FILE"
          else
            printf '\nINDIACOURTS_ENABLED=true\n' >> "$ENV_FILE"
          fi
          if [ -n "${RESERVE}" ]; then
            if grep -q '^SUMMARIZER_BACKFILL_RESERVE=' "$ENV_FILE"; then
              sed -i "s/^SUMMARIZER_BACKFILL_RESERVE=.*/SUMMARIZER_BACKFILL_RESERVE=${RESERVE}/" "$ENV_FILE"
            else
              printf 'SUMMARIZER_BACKFILL_RESERVE=%s\n' "${RESERVE}" >> "$ENV_FILE"
            fi
          fi
          echo "now set (names/flags only):"
          grep -E '^(INDIACOURTS_ENABLED|SUMMARIZER_BACKFILL_RESERVE)=' "$ENV_FILE"

      - name: enable-ocr
        if: ${{ github.event.inputs.op == 'enable-ocr' }}
        run: |
          set -euo pipefail
          ENV_FILE="$WORKDIR/.env.spark"
          [ -f "$ENV_FILE" ] || { echo "no $ENV_FILE"; exit 1; }
          CMD="python -m apps.aggregator.ocr_pdf"
          if grep -q '^INDIACOURTS_OCR_COMMAND=' "$ENV_FILE"; then
            sed -i "s|^INDIACOURTS_OCR_COMMAND=.*|INDIACOURTS_OCR_COMMAND=${CMD}|" "$ENV_FILE"
          else
            printf 'INDIACOURTS_OCR_COMMAND=%s\n' "${CMD}" >> "$ENV_FILE"
          fi
          echo "now set:"
          grep -E '^INDIACOURTS_OCR_COMMAND=' "$ENV_FILE"

      - name: smoke-india
        if: ${{ github.event.inputs.op == 'smoke-india' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.spark.yml run --rm --build refresh \
            python -m apps.aggregator ingest_indiacourts -v

      - name: extract-india
        if: ${{ github.event.inputs.op == 'extract-india' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${RETRY_DAYS}" ]; then EXTRA+=(-e "INDIACOURTS_RETRY_DAYS=${RETRY_DAYS}"); fi
          docker compose -f docker-compose.spark.yml run --rm --build "${EXTRA[@]}" refresh \
            python -m apps.aggregator extract_indiacourts_pending -v

      - name: run-replay
        if: ${{ github.event.inputs.op == 'run-replay' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.spark.yml run --rm --build \
            -v "$PWD/scripts:/app/scripts:ro" refresh \
            python scripts/replay_filings_gate.py

      - name: run-refresh
        if: ${{ github.event.inputs.op == 'run-refresh' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          bash scripts/spark_refresh.sh

      - name: sweep-start
        if: ${{ github.event.inputs.op == 'sweep-start' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.spark.yml --profile sweep up -d --build sweep
          echo "bulk sweep container started (detached — survives this job):"
          docker compose -f docker-compose.spark.yml --profile sweep ps sweep

      - name: sweep-status
        if: ${{ github.event.inputs.op == 'sweep-status' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -uo pipefail
          docker compose -f docker-compose.spark.yml --profile sweep ps sweep || true
          echo; echo "== status.json =="
          cat data/raw/sweep_spool/status.json 2>/dev/null || echo "(no status yet)"
          echo; echo "== last 40 log lines =="
          docker compose -f docker-compose.spark.yml --profile sweep logs --tail 40 sweep 2>&1 || true
          echo; echo "== spooled chunks =="
          ls -la data/raw/sweep_spool/*.jsonl 2>/dev/null | head -20 || echo "(none pending merge)"

      - name: sweep-stop
        if: ${{ github.event.inputs.op == 'sweep-stop' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.spark.yml --profile sweep stop sweep
          echo "sweep stopped (resume later with sweep-start — partition markers persist)"

      - name: gcp-sweep-launch
        if: ${{ github.event.inputs.op == 'gcp-sweep-launch' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          command -v gcloud >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          command -v gcloud >/dev/null 2>&1 || { echo "gcloud not on PATH for the runner user"; exit 1; }
          bash scripts/gcp_sweep_vm.sh

      - name: gcp-sweep-status
        if: ${{ github.event.inputs.op == 'gcp-sweep-status' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -uo pipefail
          command -v gcloud >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          echo "== gcloud identities on this box (names only) =="
          gcloud auth list 2>&1 || true
          echo
          bash scripts/gcp_sweep_vm.sh status

      - name: sweep-audit
        if: ${{ github.event.inputs.op == 'sweep-audit' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          command -v gsutil >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          AUDIT_DIR=/tmp/sweep-audit
          mkdir -p "$AUDIT_DIR"
          gsutil -m rsync gs://insider-intel-502413-corpus/raw/sweeps/indiacourts "$AUDIT_DIR" \
            2>/dev/null || true
          echo "== bucket spool contents =="
          ls -la "$AUDIT_DIR" | head -25
          echo; echo "== status.json =="
          cat "$AUDIT_DIR/status.json" 2>/dev/null || echo "(no status yet)"
          echo; echo "== chunk quality audit =="
          if ls "$AUDIT_DIR"/*.jsonl >/dev/null 2>&1; then
            docker compose -f docker-compose.spark.yml run --rm \
              -v "$AUDIT_DIR:/audit:ro" -v "$PWD/scripts:/app/scripts:ro" refresh \
              python scripts/audit_sweep_chunks.py /audit
          else
            echo "(no chunks in the bucket spool yet — nothing to audit)"
          fi

      - name: gcp-sweep-delete
        if: ${{ github.event.inputs.op == 'gcp-sweep-delete' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          command -v gcloud >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          bash scripts/gcp_sweep_vm.sh delete
