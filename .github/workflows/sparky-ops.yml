name: sparky-ops

# Operate the DGX Spark refresh tenant through the self-hosted runner ON the
# box (registered 2026-08-23) — merge-audited, dispatch-gated ops instead of
# operator-terminal relay. The runner user's permissions bound everything.
#
# Rules baked in:
#   - workflow_dispatch ONLY: nothing on this runner fires from pushes or PRs.
#   - No third-party actions (nothing to SHA-pin); no repo checkout — every op
#     targets the box's OPERATIONAL clone (default ~/insider-intel), the one
#     the 08:00Z cron builds, never the runner's workdir.
#   - Secrets never print: .env.spark is only ever shown as key NAMES.
#   - Mutating ops (pull-main, enable-india, smoke-india, run-refresh,
#     backfill-field, set-enrich-knobs, ...) require confirm=RUN. run-refresh
#     respects the wrapper's own flock — a cycle in progress makes it skip
#     loudly, so it cannot double-write the bucket.
on:
  workflow_dispatch:
    inputs:
      op:
        description: >-
          diagnose (identity/cron/log/checkout forensics) | tail-refresh-log |
          env-audit (key NAMES only) | git-status | pull-main | enable-india |
          smoke-india | run-replay | run-refresh | backfill-field-dryrun (counts
          only) | backfill-field (queues an additive field's targets for the
          nightly sweep — re-enrich without clearing; confirm=RUN) |
          set-enrich-knobs (rewrite SUMMARIZER_* caps / queue-first in
          .env.spark for a drain window; empty inputs untouched; confirm=RUN)
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - hunt-writer
          - tail-refresh-log
          - env-audit
          - git-status
          - pull-main
          - enable-india
          - enable-ocr
          - smoke-india
          - extract-india
          - run-replay
          - run-refresh
          - backfill-field-dryrun
          - backfill-field
          - set-enrich-knobs
          - sweep-start
          - sweep-status
          - sweep-stop
          - gcp-sweep-launch
          - gcp-sweep-status
          - gcp-sweep-logs
          - gcp-sweep-perf
          - gcp-sweep-delete
          - sweep-audit
          - chat-status
          - chat-swap
          - chat-huihui
          - chat-default
      confirm:
        description: "mutating ops only: must be the literal word RUN"
        required: false
        default: ""
      lines:
        description: "tail-refresh-log: line count"
        required: false
        default: "150"
      reserve:
        description: "enable-india: also set SUMMARIZER_BACKFILL_RESERVE to this (empty = leave as-is)"
        required: false
        default: ""
      retry_days:
        description: "extract-india: override INDIACOURTS_RETRY_DAYS for this run (0 = retry parked PDFs now; empty = configured cool-down)"
        required: false
        default: ""
      overlay:
        description: "chat-swap/chat-default: overlay yml in ~/sparky (e.g. model-enrich.yml); empty = base compose.yml model"
        required: false
        default: ""
      field:
        description: "backfill-field(-dryrun): additive forensics field to backfill (ADDITIVE_FIELDS)"
        required: false
        default: "actor_employer_sector"
      field_limit:
        description: "backfill-field(-dryrun): queue at most N rows (empty = SUMMARIZER_BACKFILL_RESERVE)"
        required: false
        default: ""
      max_per_run:
        description: "set-enrich-knobs: SUMMARIZER_MAX_ARTICLES_PER_RUN (0-5000; empty = leave)"
        required: false
        default: ""
      backfill_reserve:
        description: "set-enrich-knobs: SUMMARIZER_BACKFILL_RESERVE (0-500; empty = leave)"
        required: false
        default: ""
      reenrich_limit:
        description: "set-enrich-knobs: SUMMARIZER_REENRICH_MISSED_LIMIT (0-50000; empty = leave)"
        required: false
        default: ""
      queue_first:
        description: "set-enrich-knobs: SUMMARIZER_BACKFILL_QUEUE_FIRST (true|false; empty = leave)"
        required: false
        default: ""

concurrency:
  group: sparky-ops
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  op:
    runs-on: self-hosted
    timeout-minutes: 510 # a full spark_refresh is bounded at 8h by its own timeout
    env:
      WORKDIR: ${{ vars.SPARKY_WORKDIR || '' }}
      OP: ${{ github.event.inputs.op }}
      CONFIRM: ${{ github.event.inputs.confirm }}
      LINES: ${{ github.event.inputs.lines }}
      RESERVE: ${{ github.event.inputs.reserve }}
      RETRY_DAYS: ${{ github.event.inputs.retry_days }}
      OVERLAY: ${{ github.event.inputs.overlay }}
      FIELD: ${{ github.event.inputs.field }}
      FIELD_LIMIT: ${{ github.event.inputs.field_limit }}
      MAX_PER_RUN: ${{ github.event.inputs.max_per_run }}
      BACKFILL_RESERVE: ${{ github.event.inputs.backfill_reserve }}
      REENRICH_LIMIT: ${{ github.event.inputs.reenrich_limit }}
      QUEUE_FIRST: ${{ github.event.inputs.queue_first }}
    steps:
      - name: Resolve operational checkout
        run: |
          set -euo pipefail
          WORKDIR="${WORKDIR:-$HOME/insider-intel}"
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          [ -d "$WORKDIR/.git" ] || { echo "No git checkout at $WORKDIR"; exit 1; }
          case "$OP" in
            pull-main|enable-india|enable-ocr|smoke-india|extract-india|run-refresh|backfill-field|set-enrich-knobs|sweep-start|sweep-stop|gcp-sweep-launch|gcp-sweep-delete|chat-swap|chat-huihui|chat-default)
              [ "$CONFIRM" = "RUN" ] || { echo "op '$OP' mutates the box — re-dispatch with confirm=RUN"; exit 1; } ;;
          esac

      - name: diagnose
        if: ${{ github.event.inputs.op == 'diagnose' }}
        run: |
          set -uo pipefail
          echo "== identity =="; whoami; id; hostname; echo "HOME=$HOME"
          echo; echo "== operational checkout ($WORKDIR) =="
          git -C "$WORKDIR" log --oneline -1; git -C "$WORKDIR" branch --show-current
          git -C "$WORKDIR" status --short | head -20
          echo; echo "== cron (expect exactly one 0 8 * * * entry) =="
          crontab -l 2>/dev/null || echo "(no crontab for $(whoami))"
          echo; echo "== systemd timers (top 15) =="
          systemctl list-timers --all 2>/dev/null | head -15 || true
          echo; echo "== other compose checkouts under \$HOME (stale-data suspects) =="
          find "$HOME" -maxdepth 3 -name docker-compose.spark.yml -not -path "*/actions-runner/*" 2>/dev/null || true
          echo; echo "== data dir vintage in each =="
          for f in $(find "$HOME" -maxdepth 3 -name docker-compose.spark.yml -not -path "*/actions-runner/*" 2>/dev/null); do
            d="$(dirname "$f")/data/processed/articles.jsonl"
            [ -f "$d" ] && stat -c '%y  %s bytes  %n' "$d" || echo "(no processed corpus in $(dirname "$f"))"
          done
          echo; echo "== docker =="
          docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}' 2>/dev/null || echo "(no docker access for runner user)"
          echo; echo "== refresh lock =="
          ls -la /tmp/insider-intel-spark-refresh.lock 2>/dev/null || echo "(no lock held)"
          echo; echo "== spark_refresh.log tail (last 120) =="
          tail -n 120 "$WORKDIR/logs/spark_refresh.log" 2>/dev/null || echo "(no log at $WORKDIR/logs/spark_refresh.log)"
          echo; echo "== log lines around the 00:04Z window (08-22/08-23) =="
          grep -n "2026-08-2[23]" "$WORKDIR/logs/spark_refresh.log" 2>/dev/null | tail -40 || true

      - name: hunt-writer
        if: ${{ github.event.inputs.op == 'hunt-writer' }}
        run: |
          set -uo pipefail
          echo "== is the refresh flock actually HELD right now? =="
          if flock -n /tmp/insider-intel-spark-refresh.lock true 2>/dev/null; then
            echo "lock is FREE (file exists but nothing holds it)"
          else
            echo "lock is HELD; holder:"
            fuser -v /tmp/insider-intel-spark-refresh.lock 2>&1 || true
          fi
          echo; echo "== live pipeline-ish processes (start time, cmd) =="
          ps -eo pid,lstart,etime,user,args --sort=start_time \
            | grep -Ei "spark_refresh|aggregator|run_all|model-enrich|replay|gsutil|gcloud storage" \
            | grep -v grep || echo "(none running)"
          echo; echo "== ALL containers incl. exited (created/exited times are the writer timeline) =="
          docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Command}}' | head -25
          echo; echo "== docker events yesterday 18:00Z -> now (container starts/stops) =="
          docker events --since '2026-08-22T18:00:00Z' --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --filter type=container --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}}' 2>/dev/null \
            | grep -E ' (start|die) ' | head -60 || echo "(docker events unavailable)"
          echo; echo "== other home dirs (second-checkout suspects) =="
          ls -la /home/ 2>/dev/null
          for h in /home/*/; do
            [ "$h" = "$HOME/" ] && continue
            find "$h" -maxdepth 2 -name docker-compose.spark.yml 2>/dev/null || true
            [ -f "$h/insider-intel/data/processed/articles.jsonl" ] && \
              stat -c '%y  %s bytes  %n' "$h/insider-intel/data/processed/articles.jsonl" 2>/dev/null || true
          done
          echo; echo "== other crontabs (needs passwordless sudo; skipped otherwise) =="
          for u in $(cut -d: -f1 /etc/passwd); do
            sudo -n crontab -l -u "$u" 2>/dev/null | grep -v '^#' | grep . | sed "s/^/[$u] /" || true
          done
          echo; echo "== recent shell history mentioning refresh/sweep/enrich (own user only) =="
          grep -hE "spark_refresh|reenrich|sweep|model-enrich|run_all" "$HOME/.bash_history" 2>/dev/null | tail -25 || true

      - name: tail-refresh-log
        if: ${{ github.event.inputs.op == 'tail-refresh-log' }}
        run: |
          set -euo pipefail
          tail -n "${LINES:-150}" "$WORKDIR/logs/spark_refresh.log"

      - name: env-audit
        if: ${{ github.event.inputs.op == 'env-audit' }}
        run: |
          set -euo pipefail
          echo "== .env.spark key NAMES (values never printed) =="
          grep -Ev '^\s*(#|$)' "$WORKDIR/.env.spark" | cut -d= -f1 | sort

      - name: git-status
        if: ${{ github.event.inputs.op == 'git-status' }}
        run: |
          set -euo pipefail
          git -C "$WORKDIR" fetch origin main -q || true
          git -C "$WORKDIR" log --oneline -1
          git -C "$WORKDIR" branch --show-current
          git -C "$WORKDIR" status --short | head -30 || true
          echo "behind origin/main by: $(git -C "$WORKDIR" rev-list --count HEAD..origin/main 2>/dev/null || echo '?') commit(s)"

      - name: pull-main
        if: ${{ github.event.inputs.op == 'pull-main' }}
        run: |
          set -euo pipefail
          git -C "$WORKDIR" checkout main
          git -C "$WORKDIR" pull origin main
          git -C "$WORKDIR" log --oneline -1

      - name: enable-india
        if: ${{ github.event.inputs.op == 'enable-india' }}
        run: |
          set -euo pipefail
          ENV_FILE="$WORKDIR/.env.spark"
          [ -f "$ENV_FILE" ] || { echo "no $ENV_FILE"; exit 1; }
          if grep -q '^INDIACOURTS_ENABLED=' "$ENV_FILE"; then
            sed -i 's/^INDIACOURTS_ENABLED=.*/INDIACOURTS_ENABLED=true/' "$ENV_FILE"
          else
            printf '\nINDIACOURTS_ENABLED=true\n' >> "$ENV_FILE"
          fi
          if [ -n "${RESERVE}" ]; then
            if grep -q '^SUMMARIZER_BACKFILL_RESERVE=' "$ENV_FILE"; then
              sed -i "s/^SUMMARIZER_BACKFILL_RESERVE=.*/SUMMARIZER_BACKFILL_RESERVE=${RESERVE}/" "$ENV_FILE"
            else
              printf 'SUMMARIZER_BACKFILL_RESERVE=%s\n' "${RESERVE}" >> "$ENV_FILE"
            fi
          fi
          echo "now set (names/flags only):"
          grep -E '^(INDIACOURTS_ENABLED|SUMMARIZER_BACKFILL_RESERVE)=' "$ENV_FILE"

      - name: enable-ocr
        if: ${{ github.event.inputs.op == 'enable-ocr' }}
        run: |
          set -euo pipefail
          ENV_FILE="$WORKDIR/.env.spark"
          [ -f "$ENV_FILE" ] || { echo "no $ENV_FILE"; exit 1; }
          # The value MUST be double-quoted in the file: spark_refresh.sh
          # `source`s .env.spark, where an unquoted space ends the assignment
          # and executes the rest ("-m: command not found" killed the
          # 2026-08-24 08:00Z cycle at line 31). docker compose env_file
          # strips the surrounding quotes, so both consumers read it right.
          CMD="python -m apps.aggregator.ocr_pdf"
          if grep -q '^INDIACOURTS_OCR_COMMAND=' "$ENV_FILE"; then
            sed -i "s|^INDIACOURTS_OCR_COMMAND=.*|INDIACOURTS_OCR_COMMAND=\"${CMD}\"|" "$ENV_FILE"
          else
            printf 'INDIACOURTS_OCR_COMMAND="%s"\n' "${CMD}" >> "$ENV_FILE"
          fi
          echo "now set:"
          grep -E '^INDIACOURTS_OCR_COMMAND=' "$ENV_FILE"

      - name: smoke-india
        if: ${{ github.event.inputs.op == 'smoke-india' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.spark.yml run --rm --build refresh \
            python -m apps.aggregator ingest_indiacourts -v

      - name: extract-india
        if: ${{ github.event.inputs.op == 'extract-india' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${RETRY_DAYS}" ]; then EXTRA+=(-e "INDIACOURTS_RETRY_DAYS=${RETRY_DAYS}"); fi
          docker compose -f docker-compose.spark.yml run --rm --build "${EXTRA[@]}" refresh \
            python -m apps.aggregator extract_indiacourts_pending -v

      - name: run-replay
        if: ${{ github.event.inputs.op == 'run-replay' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.spark.yml run --rm --build \
            -v "$PWD/scripts:/app/scripts:ro" refresh \
            python scripts/replay_filings_gate.py

      # Additive-field backfill (docs/schema-freeze-v4.md). The dry-run prints
      # COUNTS by channel/industry only — the CLI never prints links or titles,
      # so nothing case-identifying lands in this log. The mutating op writes
      # the queue file (data/state/field_backfill_targets.json) — NOTHING is
      # cleared; the next 08:00Z cycle re-enriches queued rows and rewrites the
      # file minus the ones that landed. It refuses while the refresh flock is
      # held: the cycle rewrites that file at its end and would clobber a
      # mid-cycle queue write. Field names are validated by the CLI against
      # ADDITIVE_FIELDS; the shell guard below just keeps the input to a bare
      # identifier.
      - name: backfill-field-dryrun
        if: ${{ github.event.inputs.op == 'backfill-field-dryrun' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          [[ "$FIELD" =~ ^[a-z_]+$ ]] || { echo "field must be a bare identifier"; exit 1; }
          [[ -z "$FIELD_LIMIT" || "$FIELD_LIMIT" =~ ^[0-9]+$ ]] || { echo "field_limit must be an integer"; exit 1; }
          LIMIT_ARGS=(); [ -n "$FIELD_LIMIT" ] && LIMIT_ARGS=(--limit "$FIELD_LIMIT")
          docker compose -f docker-compose.spark.yml run --rm --build refresh \
            python -m apps.aggregator backfill_field --field "$FIELD" --dry-run "${LIMIT_ARGS[@]}"

      - name: backfill-field
        if: ${{ github.event.inputs.op == 'backfill-field' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          flock -ns /tmp/insider-intel-spark-refresh.lock -c true 2>/dev/null \
            || { echo "refresh cycle holds the flock — queue after it finishes"; exit 1; }
          [[ "$FIELD" =~ ^[a-z_]+$ ]] || { echo "field must be a bare identifier"; exit 1; }
          [[ -z "$FIELD_LIMIT" || "$FIELD_LIMIT" =~ ^[0-9]+$ ]] || { echo "field_limit must be an integer"; exit 1; }
          LIMIT_ARGS=(); [ -n "$FIELD_LIMIT" ] && LIMIT_ARGS=(--limit "$FIELD_LIMIT")
          docker compose -f docker-compose.spark.yml run --rm --build refresh \
            python -m apps.aggregator backfill_field --field "$FIELD" "${LIMIT_ARGS[@]}"

      # Drain-window knobs (HANDOFF thread #16): each provided input rewrites
      # its SUMMARIZER_* line in .env.spark (or appends it); empty inputs leave
      # the key alone. Validated before the file is touched. Values are bare
      # integers/booleans, so the two-parser quoting rule (chat-default,
      # enable-ocr: `source` vs compose env_file — only STRINGS WITH SPACES
      # need double quotes) does not apply; unquoted is safe for both readers.
      - name: set-enrich-knobs
        if: ${{ github.event.inputs.op == 'set-enrich-knobs' }}
        run: |
          set -euo pipefail
          ENV_FILE="$WORKDIR/.env.spark"
          [ -f "$ENV_FILE" ] || { echo "no $ENV_FILE"; exit 1; }
          check_int() { # name value max
            [[ "$2" =~ ^[0-9]{1,5}$ ]] || { echo "$1 must be an integer 0-$3, got '$2'"; exit 1; }
            [ "$2" -le "$3" ] || { echo "$1 must be <= $3, got '$2'"; exit 1; }
          }
          [ -z "$MAX_PER_RUN" ] || check_int max_per_run "$MAX_PER_RUN" 5000
          [ -z "$BACKFILL_RESERVE" ] || check_int backfill_reserve "$BACKFILL_RESERVE" 500
          [ -z "$REENRICH_LIMIT" ] || check_int reenrich_limit "$REENRICH_LIMIT" 50000
          [[ -z "$QUEUE_FIRST" || "$QUEUE_FIRST" =~ ^(true|false)$ ]]             || { echo "queue_first must be true or false, got '$QUEUE_FIRST'"; exit 1; }
          [ -n "$MAX_PER_RUN$BACKFILL_RESERVE$REENRICH_LIMIT$QUEUE_FIRST" ]             || { echo "nothing to set — every input is empty"; exit 1; }
          set_knob() { # KEY VALUE (empty VALUE = leave untouched)
            [ -n "$2" ] || return 0
            if grep -q "^$1=" "$ENV_FILE"; then
              sed -i "s|^$1=.*|$1=$2|" "$ENV_FILE"
            else
              printf '%s=%s\n' "$1" "$2" >> "$ENV_FILE"
            fi
          }
          set_knob SUMMARIZER_MAX_ARTICLES_PER_RUN "$MAX_PER_RUN"
          set_knob SUMMARIZER_BACKFILL_RESERVE "$BACKFILL_RESERVE"
          set_knob SUMMARIZER_REENRICH_MISSED_LIMIT "$REENRICH_LIMIT"
          set_knob SUMMARIZER_BACKFILL_QUEUE_FIRST "$QUEUE_FIRST"
          echo "now set (these four lines only):"
          grep -E '^SUMMARIZER_(MAX_ARTICLES_PER_RUN|BACKFILL_RESERVE|REENRICH_MISSED_LIMIT|BACKFILL_QUEUE_FIRST)=' "$ENV_FILE" || true

      - name: run-refresh
        if: ${{ github.event.inputs.op == 'run-refresh' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          bash scripts/spark_refresh.sh

      - name: sweep-start
        if: ${{ github.event.inputs.op == 'sweep-start' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.spark.yml --profile sweep up -d --build sweep
          echo "bulk sweep container started (detached — survives this job):"
          docker compose -f docker-compose.spark.yml --profile sweep ps sweep

      - name: sweep-status
        if: ${{ github.event.inputs.op == 'sweep-status' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -uo pipefail
          docker compose -f docker-compose.spark.yml --profile sweep ps sweep || true
          echo; echo "== status.json =="
          cat data/raw/sweep_spool/status.json 2>/dev/null || echo "(no status yet)"
          echo; echo "== last 40 log lines =="
          docker compose -f docker-compose.spark.yml --profile sweep logs --tail 40 sweep 2>&1 || true
          echo; echo "== spooled chunks =="
          ls -la data/raw/sweep_spool/*.jsonl 2>/dev/null | head -20 || echo "(none pending merge)"

      - name: sweep-stop
        if: ${{ github.event.inputs.op == 'sweep-stop' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.spark.yml --profile sweep stop sweep
          echo "sweep stopped (resume later with sweep-start — partition markers persist)"

      - name: gcp-sweep-launch
        if: ${{ github.event.inputs.op == 'gcp-sweep-launch' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          command -v gcloud >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          command -v gcloud >/dev/null 2>&1 || { echo "gcloud not on PATH for the runner user"; exit 1; }
          bash scripts/gcp_sweep_vm.sh

      - name: gcp-sweep-status
        if: ${{ github.event.inputs.op == 'gcp-sweep-status' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -uo pipefail
          command -v gcloud >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          echo "== gcloud identities on this box (names only) =="
          gcloud auth list 2>&1 || true
          echo
          bash scripts/gcp_sweep_vm.sh status

      # Diagnostic SSH into the sweep VM: container log tail (the serial
      # console never carries container stdout, so a crash traceback is
      # invisible without this), restart count, mounts, and the on-host
      # spool/state dirs. Injects the runner user's SSH key into instance
      # metadata (standard gcloud ssh mechanics) — diagnostic, no confirm.
      - name: gcp-sweep-logs
        if: ${{ github.event.inputs.op == 'gcp-sweep-logs' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -uo pipefail
          command -v gcloud >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          Z=$(gcloud compute instances list --project insider-intel-502413 \
            --filter="name=indiacourts-sweep" --format="value(zone.basename())" | head -1)
          [ -n "$Z" ] || { echo "no indiacourts-sweep VM exists right now"; exit 1; }
          gcloud compute ssh indiacourts-sweep \
            --zone "$Z" --project insider-intel-502413 --command "
              echo '== containers =='; sudo docker ps -a
              echo; echo '== sweep container config =='
              sudo docker inspect sweep --format 'workdir={{.Config.WorkingDir}} restarts={{.RestartCount}} started={{.State.StartedAt}} status={{.State.Status}}' 2>/dev/null || true
              sudo docker inspect sweep --format '{{json .Mounts}}' 2>/dev/null || true
              echo; echo '== host spool/state dirs =='
              ls -la /opt/data/raw/sweep_spool 2>/dev/null | head -20
              ls -la /opt/data/state/indiacourts 2>/dev/null | head -10
              echo; echo '== sweep container log tail =='
              sudo docker logs --tail ${LINES:-150} sweep 2>&1 | tail -n ${LINES:-150}
            "

      # Resource profile of the sweep VM: distinguishes an extraction-bound
      # run (all cores busy — the pool is the ceiling) from a GIL/feeder-bound
      # one (1-2 cores busy, extraction procs idle — the main process is the
      # ceiling) from a bandwidth-bound one (low CPU, high rx). Read-only.
      - name: gcp-sweep-perf
        if: ${{ github.event.inputs.op == 'gcp-sweep-perf' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -uo pipefail
          command -v gcloud >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          Z=$(gcloud compute instances list --project insider-intel-502413 \
            --filter="name=indiacourts-sweep" --format="value(zone.basename())" | head -1)
          [ -n "$Z" ] || { echo "no indiacourts-sweep VM exists right now"; exit 1; }
          gcloud compute ssh indiacourts-sweep \
            --zone "$Z" --project insider-intel-502413 --command "
              echo '== load / aggregate cpu (nproc:' \$(nproc) ') =='
              top -bn1 | head -12
              echo; echo '== container cpu =='
              sudo docker stats --no-stream 2>/dev/null || true
              echo; echo '== hottest processes (main python vs spawn children) =='
              ps -eo pcpu,rss:9,pid,ppid,comm --sort=-pcpu | head -36
              echo; echo '== network rx over 10s =='
              R1=\$(awk -F'[: ]+' '/:/ {if (\$2 != \"lo\") s += \$3} END {printf \"%.0f\", s}' /proc/net/dev)
              sleep 10
              R2=\$(awk -F'[: ]+' '/:/ {if (\$2 != \"lo\") s += \$3} END {printf \"%.0f\", s}' /proc/net/dev)
              echo \"rx \$(( (R2 - R1) / 10 / 1048576 )) MiB/s (\$(( (R2 - R1) / 10 )) B/s)\"
            "

      - name: sweep-audit
        if: ${{ github.event.inputs.op == 'sweep-audit' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          command -v gsutil >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          AUDIT_DIR=/tmp/sweep-audit
          rm -rf "$AUDIT_DIR"   # rsync never deletes: stale chunks from prior audits otherwise accumulate
          mkdir -p "$AUDIT_DIR"
          gsutil -m rsync gs://insider-intel-502413-corpus/raw/sweeps/indiacourts "$AUDIT_DIR" \
            2>/dev/null || true
          echo "== bucket spool contents =="
          # || true: head truncating a >25-line listing SIGPIPEs ls, which
          # pipefail would turn into a step failure once the spool grows
          ls -la "$AUDIT_DIR" | head -25 || true
          echo; echo "== status.json =="
          cat "$AUDIT_DIR/status.json" 2>/dev/null || echo "(no status yet)"
          echo; echo "== chunk quality audit =="
          if ls "$AUDIT_DIR"/*.jsonl >/dev/null 2>&1; then
            docker compose -f docker-compose.spark.yml run --rm \
              -v "$AUDIT_DIR:/audit:ro" -v "$PWD/scripts:/app/scripts:ro" refresh \
              python scripts/audit_sweep_chunks.py /audit
          else
            echo "(no chunks in the bucket spool yet — nothing to audit)"
          fi

      - name: gcp-sweep-delete
        if: ${{ github.event.inputs.op == 'gcp-sweep-delete' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          command -v gcloud >/dev/null 2>&1 || \
            export PATH="$PATH:$HOME/google-cloud-sdk/bin:/home/tim/google-cloud-sdk/bin:/snap/bin"
          bash scripts/gcp_sweep_vm.sh delete

      # Chat-stack ops: the Spark is a chat host between refresh cycles
      # (~/sparky compose: vllm + open-webui). These never run while the
      # refresh flock is held — the borrow law is sequential models only.
      - name: chat-status
        if: ${{ github.event.inputs.op == 'chat-status' }}
        run: |
          set -uo pipefail
          SPARKY="$HOME/sparky"
          echo "== refresh lock =="
          if flock -ns /tmp/insider-intel-spark-refresh.lock -c true 2>/dev/null; then
            echo "free"
          else
            echo "HELD (a refresh cycle is borrowing the box)"
          fi
          echo; echo "== served model (id only) =="
          KEY=$(sed -n 's/^VLLM_API_KEY=//p' "$SPARKY/.env" | head -1)
          curl -fsS -m 5 -H "Authorization: Bearer ${KEY}" http://127.0.0.1:8001/v1/models 2>/dev/null \
            | grep -o '"id":"[^"]*"' | head -1 || echo "(vllm not answering)"
          echo; echo "== chat containers =="
          docker ps -a --format '{{.Names}}\t{{.Status}}' | grep -Ei 'vllm|webui' || true
          echo; echo "== overlays in ~/sparky =="
          ls -la "$SPARKY"/*.yml 2>/dev/null || echo "(none)"
          echo; echo "== model lines per overlay (no secrets) =="
          grep -H -- '--model\|--served-model-name\|MODEL' "$SPARKY"/*.yml 2>/dev/null \
            | grep -vi 'key' || true
          echo; echo "== model-enrich.yml (key lines redacted) =="
          sed 's/.*[Kk][Ee][Yy].*/[REDACTED]/' "$SPARKY/model-enrich.yml" 2>/dev/null || echo "(none)"
          echo; echo "== standing chat default (SPARKY_CHAT_OVERRIDE in .env.spark) =="
          grep -E '^SPARKY_CHAT_OVERRIDE=' "$WORKDIR/.env.spark" 2>/dev/null || echo "(unset — base compose model)"
          echo; echo "== local model dirs (names + sizes only) =="
          du -sh "$SPARKY"/models/* 2>/dev/null || true
          du -sh "$HOME"/.cache/huggingface/hub/models--* 2>/dev/null | head -20 || true

      - name: chat-swap
        if: ${{ github.event.inputs.op == 'chat-swap' }}
        run: |
          set -euo pipefail
          SPARKY="$HOME/sparky"
          flock -ns /tmp/insider-intel-spark-refresh.lock -c true 2>/dev/null \
            || { echo "refresh cycle holds the flock — swap after it finishes"; exit 1; }
          if [ -n "$OVERLAY" ] && [ ! -f "$SPARKY/$OVERLAY" ]; then
            echo "no $SPARKY/$OVERLAY"; exit 1
          fi
          FILES=(-f compose.yml); [ -n "$OVERLAY" ] && FILES+=(-f "$OVERLAY")
          echo "swapping chat stack to ${OVERLAY:-base compose model}"
          (cd "$SPARKY" && docker compose "${FILES[@]}" up -d --no-deps vllm open-webui)
          KEY=$(sed -n 's/^VLLM_API_KEY=//p' "$SPARKY/.env" | head -1)
          for _ in $(seq 1 80); do
            ID=$(curl -fsS -m 5 -H "Authorization: Bearer ${KEY}" http://127.0.0.1:8001/v1/models 2>/dev/null \
              | grep -o '"id":"[^"]*"' | head -1 || true)
            [ -n "$ID" ] && { echo "serving: $ID"; exit 0; }
            sleep 15
          done
          echo "model did not answer within 20min — check docker logs on the box"; exit 1

      - name: chat-default
        if: ${{ github.event.inputs.op == 'chat-default' }}
        run: |
          set -euo pipefail
          ENV_FILE="$WORKDIR/.env.spark"
          [ -f "$ENV_FILE" ] || { echo "no $ENV_FILE"; exit 1; }
          if [ -n "$OVERLAY" ] && [ ! -f "$HOME/sparky/$OVERLAY" ]; then
            echo "no ~/sparky/$OVERLAY"; exit 1
          fi
          # Two-parser file: values always double-quoted (see 08-24 outage).
          if [ -z "$OVERLAY" ]; then
            sed -i '/^SPARKY_CHAT_OVERRIDE=/d' "$ENV_FILE"
            echo "cleared — nightly restore serves the base compose model"
          elif grep -q '^SPARKY_CHAT_OVERRIDE=' "$ENV_FILE"; then
            sed -i "s|^SPARKY_CHAT_OVERRIDE=.*|SPARKY_CHAT_OVERRIDE=\"${OVERLAY}\"|" "$ENV_FILE"
          else
            printf 'SPARKY_CHAT_OVERRIDE="%s"\n' "$OVERLAY" >> "$ENV_FILE"
          fi
          echo "now set:"; grep -E '^SPARKY_CHAT_OVERRIDE=' "$ENV_FILE" || true

      # Purpose-built for the operator's huihui chat model: derive a chat
      # overlay from the enrich overlay by model-string substitution (any
      # --quantization pin is dropped — the FP8-DYNAMIC checkpoint
      # auto-detects; tool-calling flags are ADDED — the enrich overlay never
      # needs them, but open-webui sends tool_choice "auto" and vLLM 400s
      # without --enable-auto-tool-choice + --tool-call-parser, hit live
      # 2026-08-24; hermes is the Qwen-family parser), show it redacted,
      # swap, confirm the served id, and probe a tool-enabled request.
      - name: chat-huihui
        if: ${{ github.event.inputs.op == 'chat-huihui' }}
        run: |
          set -euo pipefail
          SPARKY="$HOME/sparky"
          flock -ns /tmp/insider-intel-spark-refresh.lock -c true 2>/dev/null \
            || { echo "refresh cycle holds the flock — swap after it finishes"; exit 1; }
          TEMPLATE="$SPARKY/model-enrich.yml"
          [ -f "$TEMPLATE" ] || { echo "no $TEMPLATE to derive from"; exit 1; }
          NEMO="nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
          HUIHUI="coolthor/Huihui-Qwen3.6-35B-A3B-abliterated-FP8-DYNAMIC"
          if ! grep -q "$NEMO" "$TEMPLATE"; then
            echo "template does not mention $NEMO — structure below (redacted), fix the op:"
            sed 's/.*[Kk][Ee][Yy].*/[REDACTED]/' "$TEMPLATE"
            exit 1
          fi
          sed -e "s|${NEMO}|${HUIHUI}|g" -e '/--quantization/,+1d' \
            -e "/Huihui/a\\      - --enable-auto-tool-choice\\n      - --tool-call-parser\\n      - hermes" \
            "$TEMPLATE" > "$SPARKY/model-huihui.yml"
          echo "== generated model-huihui.yml (key lines redacted) =="
          sed 's/.*[Kk][Ee][Yy].*/[REDACTED]/' "$SPARKY/model-huihui.yml"
          (cd "$SPARKY" && docker compose -f compose.yml -f model-huihui.yml up -d --no-deps vllm open-webui)
          KEY=$(sed -n 's/^VLLM_API_KEY=//p' "$SPARKY/.env" | head -1)
          SERVED=""
          for _ in $(seq 1 60); do
            ID=$(curl -fsS -m 5 -H "Authorization: Bearer ${KEY}" http://127.0.0.1:8001/v1/models 2>/dev/null \
              | grep -o '"id":"[^"]*"' | head -1 || true)
            [ -n "$ID" ] && { echo "serving: $ID"; SERVED=1; break; }
            sleep 15
          done
          [ -n "$SERVED" ] || { echo "model did not answer within 15min — check docker logs sparky-vllm on the box"; exit 1; }
          # Prove the reported failure mode is gone: a request with a tool and
          # tool_choice auto must return 200, not the parser-flags 400.
          CODE=$(curl -s -o /tmp/huihui-tooltest.json -w '%{http_code}' -m 90 \
            -H "Authorization: Bearer ${KEY}" -H 'Content-Type: application/json' \
            -d '{"model":"'"$HUIHUI"'","messages":[{"role":"user","content":"ping"}],"max_tokens":8,"tools":[{"type":"function","function":{"name":"noop","description":"no-op","parameters":{"type":"object","properties":{}}}}],"tool_choice":"auto"}' \
            http://127.0.0.1:8001/v1/chat/completions)
          echo "tool_choice=auto probe: HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "tool-enabled request still failing:"; head -c 400 /tmp/huihui-tooltest.json; echo; exit 1; }
