name: traffic-report

# DIY analytics, tier 1 (zero client-side code): aggregate the API's Cloud Run
# request logs into a weekly traffic report. Every page load fires GET /health
# (the boot probe), so health hits ≈ page views — first-party, ad-block-proof,
# no cookies, no third parties. Report prints in the run log and lands in the
# bucket's export/ prefix. Read-only; no LLM spend.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Days of logs to aggregate"
        required: false
        default: "7"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: insider-intel-502413

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/698664056335/locations/global/workloadIdentityPools/github/providers/github-oidc # pragma: allowlist secret
          service_account: github-deployer@insider-intel-502413.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Pull request logs
        run: |
          set -euo pipefail
          DAYS="${{ inputs.days || '7' }}"
          gcloud logging read \
            'resource.type=cloud_run_revision AND resource.labels.service_name=insider-intel-api AND httpRequest.requestUrl:*' \
            --project "${PROJECT_ID}" \
            --freshness "${DAYS}d" \
            --limit 50000 \
            --format json > requests.json
          python3 -c "import json; print(len(json.load(open('requests.json'))), 'log entries')"

      - name: Aggregate
        run: |
          python3 - <<'PY'
          import json, re
          from collections import Counter, defaultdict
          from urllib.parse import urlparse

          entries = json.load(open("requests.json"))
          BOT_RE = re.compile(
              r"bot|crawl|spider|scrape|curl|wget|python-requests|httpx|go-http|"
              r"feedparser|feedfetcher|rss|monitor|probe|uptime|headless",
              re.I,
          )
          days = defaultdict(lambda: {"views": 0, "bot": 0})
          paths, referers, uas = Counter(), Counter(), Counter()
          statuses = Counter()
          total = 0
          for e in entries:
              req = e.get("httpRequest") or {}
              url = req.get("requestUrl") or ""
              path = urlparse(url).path
              ua = req.get("userAgent") or ""
              ref = req.get("referer") or ""
              day = (e.get("timestamp") or "")[:10]
              is_bot = bool(BOT_RE.search(ua)) or not ua
              total += 1
              statuses[str(req.get("status"))] += 1
              paths[path] += 1
              if ref and "thederpweb" not in ref:
                  referers[ref.split("?")[0][:80]] += 1
              # /health from a browser UA ≈ one page load (the boot probe)
              if path == "/health":
                  if is_bot:
                      days[day]["bot"] += 1
                  else:
                      days[day]["views"] += 1
                      uas[ua.split("(")[0].strip()[:40]] += 1

          lines = ["# insider-intel traffic report", ""]
          lines.append(f"Window: last {len(days)} active day(s) · {total} API requests total")
          lines.append("")
          lines.append("## Page views per day (human-UA /health hits)")
          for day in sorted(days):
              d = days[day]
              lines.append(f"- {day}: {d['views']} views ({d['bot']} bot/script probes)")
          lines.append("")
          lines.append("## Top endpoints")
          for p, n in paths.most_common(12):
              lines.append(f"- {n:6d}  {p}")
          lines.append("")
          lines.append("## External referrers")
          if referers:
              for r, n in referers.most_common(15):
                  lines.append(f"- {n:4d}  {r}")
          else:
              lines.append("- none recorded (direct visits / referrer stripped)")
          lines.append("")
          lines.append("## Browser families (page loads)")
          for u, n in uas.most_common(10):
              lines.append(f"- {n:4d}  {u}")
          lines.append("")
          lines.append("## Response status mix")
          for s, n in statuses.most_common():
              lines.append(f"- {s}: {n}")
          report = "\n".join(lines)
          open("traffic-report.md", "w").write(report + "\n")
          print(report)
          PY

      - name: Publish to bucket export/
        run: |
          gcloud storage cp traffic-report.md \
            "gs://insider-intel-502413-corpus/export/traffic-report.md" \
            && echo "report exported" || echo "export copy failed (report still in this log)"
