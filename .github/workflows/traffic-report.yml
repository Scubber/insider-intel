name: traffic-report

# DIY analytics from Cloud Run request logs — no client-side code. Every page
# load fires GET /health (the boot probe), so health hits ≈ page views:
# first-party, ad-block-proof, cookieless. Emits a summary report AND a
# full per-request forensic CSV with offline GeoIP (source IP → country/city)
# and offline ASN lookup (IP → network org + hosting/ISP/business class) —
# no third-party callouts with visitor IPs. Both land as run artifacts and
# in the bucket's export/ prefix. Read-only; no LLM spend.
#
# Network class caveat: an IP reveals network TYPE (datacenter vs consumer ISP
# vs registered business range), never "which employer". A corporate visitor on
# mobile reads as ISP; a WFH researcher reads as ISP. Treat "business" as
# "traffic from a range registered to an org", which is suggestive, not proof.
on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Days of logs to aggregate"
        required: false
        default: "7"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: insider-intel-502413

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/698664056335/locations/global/workloadIdentityPools/github/providers/github-oidc # pragma: allowlist secret
          service_account: github-deployer@insider-intel-502413.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install GeoIP database
        run: |
          set -euo pipefail
          # DB-IP Lite (CC-BY-4.0) city-level CSV: no signup, no rate limit,
          # parsed with stdlib. Falls back gracefully if the CDN is
          # unreachable — the CSV just carries empty geo columns.
          MONTH=$(date -u +%Y-%m)
          curl -fsSL "https://download.db-ip.com/free/dbip-city-lite-${MONTH}.csv.gz" \
            -o dbip.csv.gz \
            || curl -fsSL "https://download.db-ip.com/free/dbip-city-lite-$(date -u -d 'last month' +%Y-%m).csv.gz" \
              -o dbip.csv.gz \
            || true
          [ -f dbip.csv.gz ] && gunzip dbip.csv.gz && echo "geoip db ready" \
            || echo "geoip db unavailable — CSV geo columns will be blank"
          # DB-IP ASN Lite: ip_start, ip_end, as_number, as_organization.
          curl -fsSL "https://download.db-ip.com/free/dbip-asn-lite-${MONTH}.csv.gz" \
            -o dbip-asn.csv.gz \
            || curl -fsSL "https://download.db-ip.com/free/dbip-asn-lite-$(date -u -d 'last month' +%Y-%m).csv.gz" \
              -o dbip-asn.csv.gz \
            || true
          [ -f dbip-asn.csv.gz ] && gunzip dbip-asn.csv.gz && echo "asn db ready" \
            || echo "asn db unavailable — CSV org/class columns will be blank"

      - name: Pull request logs
        run: |
          set -euo pipefail
          DAYS="${{ inputs.days || '7' }}"
          # httpRequest carries remoteIp, serverIp, requestSize, responseSize,
          # latency, protocol, userAgent, referer, requestUrl, status.
          gcloud logging read \
            'resource.type=cloud_run_revision AND resource.labels.service_name=insider-intel-api AND httpRequest.requestUrl:*' \
            --project "${PROJECT_ID}" \
            --freshness "${DAYS}d" \
            --limit 50000 \
            --format json > requests.json
          python3 -c "import json; print(len(json.load(open('requests.json'))), 'log entries')"

      - name: Build forensic CSV + report
        run: |
          python3 - <<'PY'
          import csv, ipaddress, json, re
          from collections import Counter, defaultdict
          from urllib.parse import urlparse

          entries = json.load(open("requests.json"))

          # --- offline GeoIP: load DB-IP lite city CSV into sorted ranges ---
          import bisect

          # DB-IP lite CSVs carry BOTH IPv4 and IPv6 ranges. Keep them in
          # separate version-split sorted lists (v4 ints and v6 ints share a
          # number line but never overlap in practice; splitting is exact and
          # avoids any theoretical collision). Modern home/mobile traffic is
          # heavily IPv6 — dropping it blanked ~20% of visitors.
          def _load_ranges(path, extract):
              v4, v6 = [], []
              try:
                  with open(path, newline="", encoding="utf-8", errors="replace") as fh:
                      for row in csv.reader(fh):
                          if len(row) < 4:
                              continue
                          try:
                              a = ipaddress.ip_address(row[0])
                              b = ipaddress.ip_address(row[1])
                          except ValueError:
                              continue
                          rec = (int(a), int(b)) + tuple(extract(row))
                          (v4 if a.version == 4 else v6).append(rec)
                  v4.sort()
                  v6.sort()
              except FileNotFoundError:
                  pass
              return v4, v6

          def _lookup(v4, v6, s4, s6, ip, blank):
              try:
                  addr = ipaddress.ip_address(ip)
              except ValueError:
                  return blank
              ranges, starts = (v4, s4) if addr.version == 4 else (v6, s6)
              if not ranges:
                  return blank
              n = int(addr)
              i = bisect.bisect_right(starts, n) - 1
              if 0 <= i < len(ranges) and ranges[i][0] <= n <= ranges[i][1]:
                  return ranges[i][2:]
              return blank

          # DB-IP city-lite layout: ip_start, ip_end, continent, country,
          # state, city, lat, lng.
          geo4, geo6 = _load_ranges(
              "dbip.csv",
              lambda r: (r[3] if len(r) > 3 else r[2], r[5] if len(r) > 5 else ""),
          )
          gs4, gs6 = [r[0] for r in geo4], [r[0] for r in geo6]
          print(f"geoip ranges: v4={len(geo4)} v6={len(geo6)}")

          def geo(ip):
              return _lookup(geo4, geo6, gs4, gs6, ip, ("", ""))

          # --- offline ASN: IP -> network org, and a coarse network class ---
          # DB-IP ASN-lite: ip_start, ip_end, as_number, as_organization
          # (both v4 and v6 rows).
          asn4, asn6 = _load_ranges("dbip-asn.csv", lambda r: (r[3],))
          as4, as6 = [r[0] for r in asn4], [r[0] for r in asn6]
          print(f"asn ranges: v4={len(asn4)} v6={len(asn6)}")

          # Org-name heuristics. A network reveals TYPE, not employer — a
          # corporate visitor on mobile lands in ISP. "business" = registered
          # to an org that is neither a cloud host nor a consumer ISP.
          HOSTING = re.compile(
              r"amazon|aws|google|goog|azure|microsoft|digitalocean|linode|akamai|"
              r"cloudflare|ovh|hetzner|vultr|oracle|leaseweb|contabo|scaleway|"
              r"hosting|datacenter|data center|server|vps|colo|cloud|fastly|"
              r"m247|choopa|hostwinds|godaddy|namecheap|censys|shodan|palo alto|"
              r"digital ocean|tencent|alibaba|huawei cloud",
              re.I,
          )
          ISP = re.compile(
              r"comcast|verizon|at&t|at t|spectrum|charter|cox\b|centurylink|lumen|"
              r"t-mobile|sprint|frontier|windstream|mediacom|optimum|altice|"
              r"vodafone|telefonica|deutsche telekom|orange|telecom italia|"
              r"\bbt\b|sky\b|virgin media|telus|rogers|bell canada|shaw|videotron|"
              r"broadband|cable|\bdsl\b|fiber|fibre|wireless|cellular|mobile|"
              r"communications|telecom|telekom|internet services|isp\b",
              re.I,
          )

          def asn(ip):
              (org,) = _lookup(asn4, asn6, as4, as6, ip, ("",))
              return (org, "")

          def net_class(org):
              if not org:
                  return ""
              if HOSTING.search(org):
                  return "hosting"
              if ISP.search(org):
                  return "isp"
              return "business"

          BOT_RE = re.compile(
              r"bot|crawl|spider|scrape|curl|wget|python-requests|httpx|go-http|"
              r"feedparser|feedfetcher|rss|monitor|probe|uptime|headless",
              re.I,
          )

          # --- per-request forensic CSV (newest first) ---
          rows = sorted(entries, key=lambda e: e.get("timestamp") or "", reverse=True)
          countries, cities, ips = Counter(), Counter(), Counter()
          ip_4xx = Counter()
          paths, referers, uas, statuses = Counter(), Counter(), Counter(), Counter()
          days = defaultdict(lambda: {"views": 0, "bot": 0})
          suspicious_paths = Counter()
          ip_org, ip_class = {}, {}
          # Network class of human page loads (bot/script UAs excluded).
          human_class = Counter()
          human_orgs = Counter()
          total = 0

          with open("traffic-log.csv", "w", newline="", encoding="utf-8") as fh:
              w = csv.writer(fh)
              w.writerow([
                  "timestamp", "src_ip", "country", "city", "net_org",
                  "net_class", "method", "path", "query", "status", "latency",
                  "resp_bytes", "protocol", "user_agent", "referer",
              ])
              for e in rows:
                  req = e.get("httpRequest") or {}
                  ip = req.get("remoteIp") or ""
                  url = req.get("requestUrl") or ""
                  parsed = urlparse(url)
                  path, query = parsed.path, parsed.query
                  ua = req.get("userAgent") or ""
                  ref = req.get("referer") or ""
                  status = str(req.get("status") or "")
                  cc, city = geo(ip)
                  org, _ = asn(ip)
                  klass = net_class(org)
                  if ip:
                      ip_org[ip] = org
                      ip_class[ip] = klass
                  w.writerow([
                      e.get("timestamp") or "", ip, cc, city, org, klass,
                      req.get("requestMethod") or "", path, query, status,
                      req.get("latency") or "", req.get("responseSize") or "",
                      req.get("protocol") or "", ua, ref,
                  ])
                  total += 1
                  statuses[status] += 1
                  paths[path] += 1
                  if ip:
                      ips[ip] += 1
                      if status.startswith("4"):
                          ip_4xx[ip] += 1
                  if cc:
                      countries[cc] += 1
                  if city:
                      cities[f"{city}, {cc}"] += 1
                  if ref and "thederpweb" not in ref:
                      referers[ref.split("?")[0][:80]] += 1
                  if path in ("/.env", "/wp-login.php", "/admin") or ".." in path:
                      suspicious_paths[path] += 1
                  if path == "/health":
                      day = (e.get("timestamp") or "")[:10]
                      is_bot = bool(BOT_RE.search(ua)) or not ua
                      days[day]["bot" if is_bot else "views"] += 1
                      if not is_bot:
                          uas[ua.split("(")[0].strip()[:40]] += 1
                          human_class[klass or "unknown"] += 1
                          if klass == "business" and org:
                              human_orgs[org[:48]] += 1

          # --- summary report ---
          L = ["# insider-intel traffic report", ""]
          L.append(f"Window: {len(days)} active day(s) · {total} API requests · full log in traffic-log.csv")
          L.append("")
          L.append("## Page views per day (human-UA /health hits)")
          for day in sorted(days):
              d = days[day]
              L.append(f"- {day}: {d['views']} views ({d['bot']} bot/script)")
          L.append("")
          L.append("## By country")
          for cc, n in countries.most_common(20):
              L.append(f"- {n:5d}  {cc}")
          if cities:
              L.append("")
              L.append("## Top cities")
              for c, n in cities.most_common(15):
                  L.append(f"- {n:4d}  {c}")
          L.append("")
          L.append("## Human page loads by network type")
          L.append("(bot/script UAs excluded; network type ≈ datacenter vs consumer ISP")
          L.append(" vs org-registered range — suggestive of visitor kind, never employer)")
          CLASS_LABEL = {
              "hosting": "hosting/datacenter (bots, VPNs, scanners)",
              "isp": "consumer ISP (home / mobile / small office)",
              "business": "business/org-registered range",
              "unknown": "unclassified (no ASN match)",
          }
          for k in ("business", "isp", "hosting", "unknown"):
              if human_class.get(k):
                  L.append(f"- {human_class[k]:4d}  {CLASS_LABEL[k]}")
          if human_orgs:
              L.append("")
              L.append("## Business/org networks among human visitors")
              for org, n in human_orgs.most_common(15):
                  L.append(f"- {n:3d}  {org}")
          L.append("")
          L.append("## Top source IPs")
          for ip, n in ips.most_common(20):
              cc, city = geo(ip)
              loc = f" [{city}, {cc}]" if cc else ""
              org = ip_org.get(ip, "")
              tag = f" — {ip_class.get(ip,'')}: {org[:40]}" if org else ""
              L.append(f"- {n:5d}  {ip}{loc}{tag}")
          L.append("")
          L.append("## Suspicious clients (4xx-heavy / probe paths)")
          flagged = [(ip, n) for ip, n in ip_4xx.most_common(15) if n >= 3]
          if flagged:
              for ip, n in flagged:
                  cc, city = geo(ip)
                  loc = f" [{city}, {cc}]" if cc else ""
                  org = ip_org.get(ip, "")
                  tag = f" — {ip_class.get(ip,'')}: {org[:40]}" if org else ""
                  L.append(f"- {n:4d} 4xx  {ip}{loc}{tag}")
          else:
              L.append("- none (no IP with 3+ 4xx responses)")
          if suspicious_paths:
              L.append("")
              L.append("## Probe paths hit")
              for p, n in suspicious_paths.most_common():
                  L.append(f"- {n:4d}  {p}")
          L.append("")
          L.append("## Top endpoints")
          for p, n in paths.most_common(15):
              L.append(f"- {n:6d}  {p}")
          L.append("")
          L.append("## External referrers")
          if referers:
              for r, n in referers.most_common(15):
                  L.append(f"- {n:4d}  {r}")
          else:
              L.append("- none recorded (direct visits / referrer stripped)")
          L.append("")
          L.append("## Response status mix")
          for s, n in statuses.most_common():
              L.append(f"- {s}: {n}")

          report = "\n".join(L) + "\n"
          open("traffic-report.md", "w").write(report)
          print(report)
          PY

      - name: Upload run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: traffic
          path: |
            traffic-report.md
            traffic-log.csv
          retention-days: 30

      - name: Publish to bucket export/
        run: |
          gcloud storage cp traffic-report.md \
            "gs://insider-intel-502413-corpus/export/traffic-report.md" || true
          gcloud storage cp traffic-log.csv \
            "gs://insider-intel-502413-corpus/export/traffic-log.csv" \
            && echo "report + forensic CSV exported" \
            || echo "export copy failed (artifacts still attached to this run)"
