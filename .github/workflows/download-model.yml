name: download-model

# Download a Hugging Face model onto the DGX Spark via the self-hosted runner.
# Queues naturally via concurrency group if multiple dispatches.
# Targets the HF cache (~/.cache/huggingface/hub) used by sparky vLLM.
# Download-only: never touches the running vllm/open-webui containers.
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "HF model ID to download (e.g. coolthor/Huihui-Qwen3.6-35B-A3B-abliterated-NVFP4-W4A4)"
        required: true
        type: string
      confirm:
        description: "must be the literal word RUN"
        required: true
        default: ""

concurrency:
  group: sparky-ops
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  download:
    runs-on: self-hosted
    timeout-minutes: 180
    env:
      MODEL: ${{ github.event.inputs.model_id }}
      CONFIRM: ${{ github.event.inputs.confirm }}
    steps:
      - name: Download model
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "RUN" ] || { echo "confirm must be RUN"; exit 1; }
          case "$MODEL" in
            */*) ;;
            *) echo "model_id must look like owner/name"; exit 1 ;;
          esac
          SPARKY="$HOME/sparky"
          HF_TOKEN=$(sed -n 's/^HF_TOKEN=//p' "$SPARKY/.env" | head -1)
          [ -n "$HF_TOKEN" ] || { echo "No HF_TOKEN in $SPARKY/.env"; exit 1; }
          export HF_TOKEN
          HUB="$HOME/.cache/huggingface/hub"
          mkdir -p "$HUB"

          echo "== disk before =="
          df -h "$HUB"
          NEED=$(python3 - "$MODEL" <<'PY'
          import json, os, sys, urllib.request
          req = urllib.request.Request(
              "https://huggingface.co/api/models/%s?blobs=true" % sys.argv[1],
              headers={"Authorization": "Bearer " + os.environ["HF_TOKEN"]})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          print(sum((f.get("size") or 0) for f in d.get("siblings", [])))
          PY
          )
          FREE=$(df -B1 --output=avail "$HUB" | tail -1 | tr -d ' ')
          echo "repo size: $((NEED / 1000000000)) GB, free: $((FREE / 1000000000)) GB"
          if [ "$FREE" -lt $((NEED + 20000000000)) ]; then
            echo "Not enough disk (need repo size + 20 GB headroom)"; exit 1
          fi

          echo "Downloading $MODEL ..."
          if [ -w "$HUB" ]; then
            if command -v hf >/dev/null 2>&1; then
              hf download "$MODEL"
            elif command -v huggingface-cli >/dev/null 2>&1; then
              huggingface-cli download "$MODEL"
            else
              VENV="$HOME/.cache/hf-dl-venv"
              [ -x "$VENV/bin/python" ] || python3 -m venv "$VENV"
              "$VENV/bin/pip" install --quiet --upgrade huggingface_hub
              "$VENV/bin/python" -c 'import sys; from huggingface_hub import snapshot_download; print(snapshot_download(repo_id=sys.argv[1]))' "$MODEL"
            fi
          else
            # The hub dir is owned by root (created by the sparky-vllm
            # container), so the runner user cannot write it. Download with
            # a throwaway container from the same vLLM image (it ships
            # huggingface_hub), as root, into the same cache. The serving
            # container is not touched. Cache symlinks are relative, so the
            # in-container mount path does not matter.
            IMG=$(docker inspect sparky-vllm --format '{{.Config.Image}}')
            echo "$HUB not writable by $(whoami); downloading via throwaway container ($IMG)"
            docker run --rm --entrypoint python3 \
              -e HF_TOKEN -e HF_HUB_CACHE=/hfhub \
              -v "$HUB":/hfhub \
              "$IMG" -c 'import sys; from huggingface_hub import snapshot_download; print(snapshot_download(repo_id=sys.argv[1]))' "$MODEL"
          fi
          echo "Download complete for $MODEL"
          echo "== disk after =="
          df -h "$HUB"
          echo "== HF cache =="
          du -sh "$HUB"/models--* 2>/dev/null || true
