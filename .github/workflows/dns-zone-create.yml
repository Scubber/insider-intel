name: dns-zone-create

# One-shot, dispatch-gated: create a zone in the Cloudflare account so it can
# be activated in dns/config.yaml and populated by dns-apply. Uses the
# broader-scoped CLOUDFLARE_DNS_ADMIN secret (zone creation needs Zone:Edit,
# which the day-to-day CLOUDFLARE_API_TOKEN deliberately lacks). Idempotent:
# an already-existing zone is fetched and reported instead of failing.
# Prints the assigned nameservers — the values the registrar-side NS switch
# needs — into the run summary. No third-party actions, nothing to pin.

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone name to create (e.g. thederpweb.com)"
        required: true
        default: "thederpweb.com"

permissions:
  contents: read

concurrency:
  group: dns-zone-create
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create (or fetch) zone
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_DNS_ADMIN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACC_ID }}
          ZONE: ${{ inputs.zone }}
        run: |
          set -euo pipefail
          create=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data "{\"name\":\"${ZONE}\",\"account\":{\"id\":\"${CF_ACC}\"},\"type\":\"full\"}")
          if [ "$(echo "$create" | jq -r '.success')" = "true" ]; then
            echo "$create" | jq '{id: .result.id, name: .result.name, status: .result.status, name_servers: .result.name_servers}'
            echo "$create" | jq -r '"## Zone created: \(.result.name)\nStatus: \(.result.status)\n\nAssigned nameservers:\n\(.result.name_servers | map("- `" + . + "`") | join("\n"))"' >> "$GITHUB_STEP_SUMMARY"
          elif echo "$create" | jq -e '.errors[]? | select(.code == 1061)' >/dev/null; then
            echo "Zone already exists — fetching."
            existing=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=${ZONE}" \
              -H "Authorization: Bearer ${CF_TOKEN}")
            echo "$existing" | jq '{id: .result[0].id, name: .result[0].name, status: .result[0].status, name_servers: .result[0].name_servers}'
            echo "$existing" | jq -r '"## Zone already existed: \(.result[0].name)\nStatus: \(.result[0].status)\n\nAssigned nameservers:\n\(.result[0].name_servers | map("- `" + . + "`") | join("\n"))"' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Zone creation failed:" >&2
            echo "$create" | jq '.errors' >&2
            exit 1
          fi
