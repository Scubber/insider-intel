name: corpus-emailscan

# Read-only research scan: download the live corpus and tally the email
# addresses quoted in case documents — DOMAIN level only, context-classified
# (exfil-destination vs counsel/service vs mention), with every snippet
# redacted to <redacted>@domain before it reaches the log. No mutation, no
# LLM spend; scripts/email_domain_scan.py owns the redaction guarantee.
on:
  workflow_dispatch:
    inputs:
      max_snippets:
        description: "How many redacted exfil-context snippets to print"
        required: false
        default: "150"
      context_chars:
        description: "Context window around each hit, in characters"
        required: false
        default: "160"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: insider-intel-502413
  OBJ: gs://insider-intel-502413-corpus/processed/articles.jsonl
  BUCKET: gs://insider-intel-502413-corpus

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/698664056335/locations/global/workloadIdentityPools/github/providers/github-oidc # pragma: allowlist secret
          service_account: github-deployer@insider-intel-502413.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Scan email domains and write to export/ prefix
        env:
          MAX_SNIPPETS: ${{ inputs.max_snippets }}
          CONTEXT_CHARS: ${{ inputs.context_chars }}
        run: |
          set -euo pipefail
          gcloud storage cp "${OBJ}" corpus.jsonl
          wc -l corpus.jsonl
          python3 scripts/email_domain_scan.py corpus.jsonl \
            --max-snippets "${MAX_SNIPPETS:-150}" --context-chars "${CONTEXT_CHARS:-160}" \
            --json email-domain-scan.json \
            | tee email-domain-scan.md
          gcloud storage cp email-domain-scan.md "${BUCKET}/export/email-domain-scan.md"
          gcloud storage cp email-domain-scan.json "${BUCKET}/export/email-domain-scan.json"
          echo
          echo "Pull with:"
          echo "  gcloud storage cp ${BUCKET}/export/email-domain-scan.md ."
          echo "  gcloud storage cp ${BUCKET}/export/email-domain-scan.json ."
