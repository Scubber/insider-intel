name: dns-apply

# Apply merged dns/** changes to Cloudflare via octoDNS. Merge to main IS
# the approval — same contract as every other deploy in this repo.
on:
  push:
    branches: [main]
    paths:
      - "dns/**"

permissions:
  contents: read

concurrency:
  group: dns-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install octoDNS
        run: pip install --quiet 'octodns==1.21.1' 'octodns-cloudflare==1.2.0'
      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if python3 -c 'import sys,yaml; sys.exit(0 if yaml.safe_load(open("dns/config.yaml"))["zones"] else 1)'; then
            octodns-sync --config-file dns/config.yaml --doit
          else
            echo "No active zones in dns/config.yaml — nothing to apply (scaffold state)."
          fi
