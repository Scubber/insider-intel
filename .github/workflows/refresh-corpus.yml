name: refresh-corpus

# Manually execute the corpus-refresh Cloud Run job from GitHub (keyless OIDC,
# same identity as deploys) so on-demand refreshes are visible and auditable
# in the Actions tab instead of ad-hoc gcloud runs.
on:
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: >-
          Re-process the ENTIRE corpus (lexical retagging after an ITM/lexicon
          change). No LLM re-billing — enrichment is billed-once — but the run
          takes longer than a normal refresh. One-off args override; the job's
          stored config is untouched.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: insider-intel-502413
  REGION: us-east1

concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Must outlast the Cloud Run job's 45m task timeout, or the watcher dies
    # (and stops reporting) while the refresh is still legitimately running.
    timeout-minutes: 75
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/698664056335/locations/global/workloadIdentityPools/github/providers/github-oidc # pragma: allowlist secret
          service_account: github-deployer@insider-intel-502413.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Execute corpus-refresh job
        env:
          FORCE: ${{ inputs.force_reprocess && 'true' || 'false' }}
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          if [ "${FORCE}" = "true" ]; then
            # One-off args override: the job's stored args are a shell
            # invocation ["-c", "python -m apps.aggregator all && …reload…"].
            # Inject --force INSIDE that shell string (a bare extra arg would
            # be sh's $0 and get ignored), and pass the override with a custom
            # delimiter — the command string contains commas, so gcloud's
            # default comma-splitting would corrupt it.
            CMD=$(gcloud run jobs describe corpus-refresh \
              --region "${REGION}" --project "${PROJECT_ID}" --format=json \
              | jq -r '.spec.template.spec.template.spec.containers[0].args // [] | .[1] // empty')
            if [ -z "${CMD}" ]; then
              echo "Job args are not the expected [-c, <shell>] shape — cannot build a --force override safely." >&2
              exit 1
            fi
            FORCED_CMD="${CMD/python -m apps.aggregator all/python -m apps.aggregator all --force}"
            if [ "${FORCED_CMD}" = "${CMD}" ]; then
              echo "Could not find 'python -m apps.aggregator all' in the job command — refusing to guess." >&2
              exit 1
            fi
            echo "Forced reprocess command: ${FORCED_CMD}"
            EXTRA_FLAGS+=(--args "^@@^-c@@${FORCED_CMD}")
          fi
          gcloud run jobs execute corpus-refresh \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            "${EXTRA_FLAGS[@]}" \
            --wait
      - name: Refresh highlights
        if: always()
        run: |
          gcloud logging read "resource.labels.job_name=corpus-refresh" \
            --project "${PROJECT_ID}" --freshness=12m \
            --format='value(textPayload)' \
            | grep -iE 'PACER|backfill|throttled|summar|enrich|discover|technique seeds|case record|anthropic|gemini|openai|xai|LLM|X ingest|Skipping|reloaded|429|publication|\[OK\]|\[FAIL\]' \
            | head -120 || true
