name: deploy-api

# Keyless CD: GitHub OIDC → Workload Identity Federation → github-deployer SA.
# Builds the runtime image (corpus-free; the service mounts the GCS bucket)
# and rolls the Cloud Run service + refresh job to it.
on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "shared/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: insider-intel-502413
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/insider-intel-502413/insider-intel/insider-intel-api

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/698664056335/locations/global/workloadIdentityPools/github/providers/github-oidc # pragma: allowlist secret
          service_account: github-deployer@insider-intel-502413.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q
          docker build -t "${IMAGE}:${GITHUB_SHA::7}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"
      - name: Deploy API service
        run: |
          # --memory is asserted here (GitOps): the service ran at the legacy
          # 1Gi and started OOM-killing instances mid-request (burst 503s
          # "connection to the instance had an error" across every endpoint,
          # 2026-07-26) once the corpus reached ~6.6k enriched rows — /reload
          # holds the old and new index simultaneously, which is the spike
          # that kills it. Scale-to-zero means the bump costs only while
          # serving.
          # ADMIN_API_TOKEN gates the write/ops endpoints (/reload,
          # subscription writes, ingest_url) — create the secret BEFORE this
          # mapping first deploys:
          #   openssl rand -hex 32 | gcloud secrets create ADMIN_API_TOKEN --data-file=-
          gcloud run deploy insider-intel-api \
            --image "${IMAGE}:${GITHUB_SHA::7}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --memory=2Gi \
            --update-secrets 'ADMIN_API_TOKEN=ADMIN_API_TOKEN:latest'
      - name: Roll refresh job to same image
        # Re-assert the ingest config here (GitOps: repo is the source of truth).
        # --update-env-vars merges, so the API keys/secret mappings on the job are
        # preserved. Change models/providers by editing this line + merging — no
        # manual gcloud. The `^##^` prefix sets `##` as the pair delimiter so the
        # comma-separated provider *chains* survive.
        #  - SUMMARIZER_LLM_PROVIDER: ordered enrichment fallback chain; each is
        #    tried until one succeeds, and any provider without a key is skipped,
        #    so unfunded entries are harmless. Order: anthropic > openai > sol >
        #    gemini > xai. Each needs its key mapped to the job (Secret Manager).
        #    `sol` is defined in LLM_CUSTOM_PROVIDERS below as a custom
        #    OpenAI-compatible endpoint reusing OPENAI_API_KEY (no new secret).
        #  - Models are per-provider in a mixed chain: SUMMARIZER_MODEL pins the
        #    ENRICHER's model on the chain's first named provider (anthropic)
        #    ONLY — it must be a valid Anthropic id or it poisons the Anthropic
        #    link and drops the openai fallback to its mini default. Set to
        #    claude-haiku-4-5-20251001: enrichment runs on Haiku 4.5 to fill the
        #    remaining backlog at ~1/3 the Sonnet cost (~$1/$5 vs $3/$15 per MTok).
        #    The classifier also uses the cheap ANTHROPIC_MODEL (Haiku) default;
        #    SUMMARIZER_MODEL is scoped to the summarizer role. OPENAI_COMPAT_MODEL=gpt-4o
        #    pins the openai fallback link; sol comes from LLM_CUSTOM_PROVIDERS,
        #    gemini/xai use their defaults.
        #  - Cap 25/run (trickle mode, 2026-07-26 — backlog converted at full
        #    throttle; steady state only) + 60m timeout (45m proved too tight on 2026-07-25: a
        #    full-throughput run — 81 feeds + 50-body backfill + filings-heavy
        #    sweep + discovery — hit the 45m kill and retried): filings enrich
        #    at full document length (~15-25s/call, more with discovery); a timeout
        #    triggers a Cloud Run task RETRY that re-bills whatever wasn't yet
        #    checkpointed. The backfill checkpoints every 5 conversions, but the
        #    timeout should still comfortably cover one full sweep.
        #  - BACKFILL_RESERVE=15: the fresh-news batch may spend at most 10 of
        #    the 25; 15 is guaranteed to the filings-first sweep.
        # Discovery (second call per case, doubles spend) inherits the enrichment
        # chain by default — asserted explicitly below with its own cap
        # (DISCOVERER_MAX_ARTICLES_PER_RUN=0 turns it off).
        #  - CourtListener tuned for a paid Tier-2 token (15/min, 150/hour,
        #    600/day). REQUEST_DELAY=5s (~12/min, under the 15/min burst);
        #    HISTORY_QUERIES_PER_WINDOW=0 fires the FULL query rotation each run
        #    so historical windows drain in one pass (social-engineering / sim-
        #    swap / device-identifier cases included); BACKFILL_MAX_DOCKETS=10
        #    (trickle mode) bounds free-archive body pulls per run. Budget ≈ 34
        #    forward + 26 history + 10 backfill ≈ 70 req/run × 4 runs (< 600/day).
        #    REQUIRES the token mapped as a secret (one-time, persists):
        #      gcloud run jobs update corpus-refresh --region us-east1 \
        #        --set-secrets COURTLISTENER_API_TOKEN=COURTLISTENER_API_TOKEN:latest
        #    Without it the job runs anonymous (5/min) and these caps will 429.
        #  - PACER_PURCHASE_MAX_PER_RUN=5 ARMS RECAP-Fetch buying (account
        #    #9182404 cleared review, search privileges active 2026-07-24).
        #    Bounded by PACER_QUARTERLY_BUDGET_CENTS=2700 ($27/quarter, under
        #    PACER's $30 fee waiver — typical usage bills nothing) and only
        #    insider-qualifying cases whose free-archive check came up empty.
        #    Set back to 0 to re-park.
        #  - --update-secrets RE-ASSERTS the Secret Manager mappings on every
        #    deploy. This is load-bearing: a manual `--set-secrets` call (as used
        #    when the PACER creds were mapped) REPLACES the whole mapping set and
        #    silently dropped ANTHROPIC/OPENAI/COURTLISTENER — which killed
        #    enrichment (chain skips a provider with no key, no log) and 401'd
        #    every text backfill for two days. --update-secrets merges, so
        #    asserting them here makes the mappings self-healing under GitOps.
        #    The secret VALUES stay in Secret Manager; these are references only.
        run: |
          gcloud run jobs update corpus-refresh \
            --image "${IMAGE}:${GITHUB_SHA::7}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --task-timeout=60m \
            --update-secrets 'ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,COURTLISTENER_API_TOKEN=COURTLISTENER_API_TOKEN:latest,PACER_USERNAME=PACER_USERNAME:latest,PACER_PASSWORD=PACER_PASSWORD:latest,ADMIN_API_TOKEN=ADMIN_API_TOKEN:latest' \
            --update-env-vars '^##^SUMMARIZER_LLM_PROVIDER=anthropic,openai,sol,gemini,xai##SUMMARIZER_MODEL=claude-haiku-4-5-20251001##OPENAI_COMPAT_MODEL=gpt-4o##SUMMARIZER_MAX_ARTICLES_PER_RUN=25##SUMMARIZER_BACKFILL_RESERVE=15##DISCOVERER_LLM_PROVIDER=anthropic,openai,sol,gemini,xai##DISCOVERER_MAX_ARTICLES_PER_RUN=3##LLM_CUSTOM_PROVIDERS={"sol":{"base_url":"https://api.openai.com/v1","model":"gpt-5.6-sol","api_key_env":"OPENAI_API_KEY"}}##COURTLISTENER_REQUEST_DELAY_SECONDS=5##COURTLISTENER_HISTORY_QUERIES_PER_WINDOW=0##COURTLISTENER_BACKFILL_MAX_DOCKETS=10##PACER_PURCHASE_MAX_PER_RUN=5##HUNT_SYNTH_MAX_PER_RUN=10'
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe insider-intel-api --region "${REGION}" --format='value(status.url)')
          curl -sf "${URL}/health" >/dev/null && echo "health OK"
          curl -sf "${URL}/articles?limit=1" >/dev/null && echo "articles OK"
          curl -sf "${URL}/social/catalog" >/dev/null && echo "social catalog OK"
          curl -sf "${URL}/trending?limit=3" >/dev/null && echo "trending OK"
          curl -sf "${URL}/feed.xml?limit=1" | grep -q '<feed' && echo "feed.xml OK"
          curl -sf "${URL}/evidence/ledger?top=3" | grep -q '"detected_by"' && echo "evidence ledger OK"
          # write/ops endpoints are token-gated: unauthenticated writes must 401
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${URL}/social/subscriptions" \
            -H 'Content-Type: application/json' \
            -d '{"platform":"reddit","id":"deploy-smoke-probe"}')
          test "${CODE}" = "401" && echo "admin gate OK (unauthenticated write → 401)"
          RELOAD_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${URL}/reload")
          test "${RELOAD_CODE}" = "401" && echo "reload gate OK (unauthenticated → 401)"
          # authenticated round-trip when the deployer can read the secret
          # (catches read-only mount regressions); skipped gracefully otherwise
          TOKEN=$(gcloud secrets versions access latest --secret=ADMIN_API_TOKEN 2>/dev/null || true)
          if [ -n "${TOKEN}" ]; then
            curl -sf -X POST "${URL}/social/subscriptions" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              -d '{"platform":"reddit","id":"deploy-smoke-probe"}' >/dev/null
            curl -sf -X DELETE "${URL}/social/subscriptions/reddit/deploy-smoke-probe" \
              -H "Authorization: Bearer ${TOKEN}" >/dev/null
            echo "authenticated subscription round-trip OK"
          else
            echo "deployer cannot read ADMIN_API_TOKEN — skipping authenticated round-trip"
          fi
          # extract endpoint assembles stored forensics — no LLM at read time.
          # An unindexed link short-circuits early (mode=seeds, count=0).
          EXTRACT=$(curl -sf -X POST "${URL}/extract/ttps" \
            -H 'Content-Type: application/json' \
            -d '{"links":["https://example.invalid/deploy-smoke-probe"]}')
          echo "${EXTRACT}" | grep -q '"mode":"seeds"'
          echo "${EXTRACT}" | grep -q '"article_count":0'
          echo "extract smoke OK"
          curl -sf "${URL}/articles?channel=publications&itm_alignment=all&limit=1" >/dev/null \
            && echo "publications facet OK"
          # ingest_url negative path: with the admin gate active this is 401
          # unauthenticated (the desired prod state); without a token set it
          # must map an unresolvable host to a clean 4xx/5xx, never hang or
          # 200 (no real ingestion per deploy).
          PUB_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${URL}/publications/ingest_url" \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.invalid/deploy-smoke-probe"}')
          case "${PUB_CODE}" in
            401|400|404|502|503) echo "publications ingest_url smoke OK (${PUB_CODE})" ;;
            *) echo "unexpected publications ingest_url status ${PUB_CODE}" >&2; exit 1 ;;
          esac
