name: corpus-peerset

# PRIVATE peer-set study lane: download the live corpus and profile the
# insiders in cases whose stored text NAMES a curated set of firms
# (shared/data/peer_sets.json — the operator's competitive set). Counts only:
# per-firm mention counts (presence in the record, never fault), the pooled
# job function × employment state table, motives, postures, the sliced
# ledger's techniques and evidence-record classes, and a Voya-only appendix
# with the COURTLISTENER_COMPANY_WATCHLIST caveat. Roles, never individuals —
# test-pinned to carry no name, title, link or quote. Written ONLY to the
# private bucket export prefix; never a public RESEARCH surface. No
# mutation, no LLM spend; scripts/peer_set_profiles.py owns the counting
# rules and the reading rules it prints.
on:
  workflow_dispatch:
    inputs:
      peer_set:
        description: "Peer set id (shared/data/peer_sets.json)"
        required: false
        default: "retirement-insurance-asset-mgmt"
      top:
        description: "Rows per table"
        required: false
        default: "25"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: insider-intel-502413
  OBJ: gs://insider-intel-502413-corpus/processed/articles.jsonl
  BUCKET: gs://insider-intel-502413-corpus

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/698664056335/locations/global/workloadIdentityPools/github/providers/github-oidc # pragma: allowlist secret
          service_account: github-deployer@insider-intel-502413.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build peer-set profiles and write to export/ prefix
        env:
          PEER_SET: ${{ inputs.peer_set }}
          TOP: ${{ inputs.top }}
        run: |
          set -euo pipefail
          PEER_SET="${PEER_SET:-retirement-insurance-asset-mgmt}"
          TOP="${TOP:-25}"
          gcloud storage cp "${OBJ}" corpus.jsonl
          wc -l corpus.jsonl
          python3 scripts/peer_set_profiles.py corpus.jsonl \
            --peer-set "$PEER_SET" --top "$TOP" \
            --json "peer-set-profiles-$PEER_SET.json" \
            | tee "peer-set-profiles-$PEER_SET.md"
          gcloud storage cp "peer-set-profiles-$PEER_SET.md" "${BUCKET}/export/peer-set-profiles-$PEER_SET.md"
          gcloud storage cp "peer-set-profiles-$PEER_SET.json" "${BUCKET}/export/peer-set-profiles-$PEER_SET.json"
          echo
          echo "Pull with:"
          echo "  gcloud storage cp ${BUCKET}/export/peer-set-profiles-$PEER_SET.md ."
          echo "  gcloud storage cp ${BUCKET}/export/peer-set-profiles-$PEER_SET.json ."
