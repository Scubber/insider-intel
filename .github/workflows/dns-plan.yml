name: dns-plan

# Dry-run octoDNS against Cloudflare for PRs touching dns/**, and on manual
# dispatch (which doubles as a CLOUDFLARE_API_TOKEN smoke test). Read-only:
# never applies. NOTE: fork PRs run without the secret by GitHub's rules —
# the plan step is skipped there rather than failing.
on:
  pull_request:
    paths:
      - "dns/**"
      - ".github/workflows/dns-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # secrets.* is not valid in step-level `if`; hoist presence to env.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install octoDNS
        run: pip install --quiet 'octodns==1.21.1' 'octodns-cloudflare==1.2.0'
      - name: Verify token (list zones)
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("token OK —", d["result_info"]["total_count"], "zone(s):", ", ".join(z["name"] for z in d["result"]) or "(none yet)")'
      - name: Plan (dry run)
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if python3 -c 'import sys,yaml; sys.exit(0 if yaml.safe_load(open("dns/config.yaml"))["zones"] else 1)'; then
            octodns-sync --config-file dns/config.yaml
          else
            echo "No active zones in dns/config.yaml — nothing to plan (scaffold state)."
          fi
      - name: Fork PR notice
        if: env.HAS_TOKEN != 'true'
        run: echo "Secret unavailable (fork PR) — plan skipped."
